# WSF — visual-review export for PR #417's Join outcome correction: the three
# frames W4's PR adds under docs/design-target/review/join-outcome-correction/
# (the corrected unconfirmed-outcome screen at 390x640, 390x844 and 430x932),
# exported at their source commit as a workflow artifact with a manifest that
# pins each file to that commit — the reviewer's proven native-file path
# (Director PR #365 comment 5785419114: final Join page verdict follows the
# correction; L0 integrates after it).
# Same exporter as #403, #406, #407, #410, #413 and #414, same posture: ordinary pull_request
# job into this one branch, contents:read, pinned actions, persist-credentials
# false, inline stdlib packaging, nothing from the tree executed, nothing
# rendered or resized. This branch carries only this file on top of W4's
# head and is never merged; it exists to run the job.
name: WSF visual-review export — #417 Join outcome correction

on:
  pull_request:
    branches:
      - claude/wsf-sprint-w4-join-outcome-copy
    paths:
      - '.github/workflows/wsf-visual-review-417-join-correction.yml'
      - 'docs/design-target/review/join-outcome-correction/**'

permissions:
  contents: read

concurrency:
  group: wsf-visual-review-417-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Export the pinned canonical images with a manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head commit exactly (not the merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Package original bytes + manifest (inline, stdlib only; nothing from the tree is executed)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          repo = os.environ['REPO']
          want = os.environ['SOURCE_SHA']
          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if head != want:
              sys.exit(f'checked-out HEAD {head} is not the PR head {want}')
          JC = 'docs/design-target/review/join-outcome-correction'
          # THE EXACT ALLOWLIST: the three images PR #417 adds — W4's corrected
          # unconfirmed-outcome screen at the PR head this job checks out, original
          # committed bytes only. Reached by one INJECTED transport fault (the join
          # callable refused with a status carrying no mapped code); no server
          # answer is faked. Source app-shell 44cc063 + this branch's correction.
          allow = [
              (f'{JC}/join-unconfirmed-390x640.png', 'Join · corrected unconfirmed outcome · viewport 390x640 · W4, PR #417 · INJECTED transport fault · page verdict pending'),
              (f'{JC}/join-unconfirmed-390x844.png', 'Join · corrected unconfirmed outcome · viewport 390x844 · W4, PR #417 · INJECTED transport fault · page verdict pending'),
              (f'{JC}/join-unconfirmed-430x932.png', 'Join · corrected unconfirmed outcome · viewport 430x932 · W4, PR #417 · INJECTED transport fault · page verdict pending'),
          ]
          PER_FILE_MAX = 8 * 1024 * 1024
          TOTAL_MAX = 24 * 1024 * 1024
          out = 'wsf-visual-review-417-join-correction'
          rows, total = [], 0
          for rel, label in allow:
              # Tracked as an ordinary regular file at this commit: mode 100644,
              # never a symlink (120000), submodule (160000) or executable.
              stage = git('ls-files', '--stage', '--', rel)
              if not stage:
                  sys.exit(f'not tracked at HEAD: {rel}')
              mode, blob = stage.split()[0], stage.split()[1]
              if mode != '100644':
                  sys.exit(f'refusing {rel}: tracked mode {mode}, not a regular file')
              if os.path.islink(rel) or not os.path.isfile(rel):
                  sys.exit(f'refusing {rel}: not a regular file in the checkout')
              if blob != git('rev-parse', f'HEAD:{rel}'):
                  sys.exit(f'index/HEAD disagree on {rel}')
              data = open(rel, 'rb').read()
              if len(data) > PER_FILE_MAX:
                  sys.exit(f'refusing {rel}: {len(data)} bytes exceeds the per-file bound')
              total += len(data)
              if total > TOTAL_MAX:
                  sys.exit(f'refusing: total exceeds the {TOTAL_MAX}-byte bound at {rel}')
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  sys.exit(f'not a PNG: {rel}')
              w, h = struct.unpack('>II', data[16:24])
              dest = os.path.join(out, rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copyfile(rel, dest)
              # The exported bytes must BE the committed blob: rehash the copy
              # with git's own object hashing and compare, not merely record it.
              copied = open(dest, 'rb').read()
              rehashed = git('hash-object', '--', dest)
              if rehashed != blob or hashlib.sha256(copied).digest() != hashlib.sha256(data).digest():
                  sys.exit(f'exported bytes for {rel} do not match the committed blob ({rehashed} vs {blob})')
              rows.append({'path': rel, 'label': label, 'git_blob_sha1': blob, 'bytes': len(data),
                           'sha256': hashlib.sha256(data).hexdigest(), 'width': w, 'height': h})
          manifest = {'repo': repo, 'source_sha': head, 'files_total_bytes': total,
                      'note': 'original bytes copied from this commit and re-hashed against the git blob; nothing rendered, resized or repaired',
                      'files': rows}
          json.dump(manifest, open(os.path.join(out, 'MANIFEST.json'), 'w'), indent=2)
          with open(os.path.join(out, 'MANIFEST.md'), 'w') as f:
              f.write(f'# PR #417 Join outcome correction — visual review package\n\nRepository `{repo}` · source commit `{head}` · {len(rows)} files, {total} bytes · original bytes, re-hashed against git.\n\n')
              f.write('| path | label | git blob | bytes | sha256 | w×h |\n| --- | --- | --- | ---: | --- | --- |\n')
              for r in rows:
                  f.write(f"| `{r['path']}` | {r['label']} | `{r['git_blob_sha1']}` | {r['bytes']} | `{r['sha256']}` | {r['width']}×{r['height']} |\n")
          print(open(os.path.join(out, 'MANIFEST.md')).read())
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-visual-review-417-join-correction-${{ github.event.pull_request.head.sha }}
          path: wsf-visual-review-417-join-correction
          if-no-files-found: error
          retention-days: 7
          # The PNGs are already compressed; keep their bytes verbatim inside the zip.
          compression-level: 0
