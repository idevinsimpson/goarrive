# WSF — visual-review export for PR #400's short-phone evidence: the twelve
# existing before/after PNGs under docs/design-target/review/page-02-move/
# short-phone/ (before = the frozen e609c57 build, after = the ff8c880 build),
# exported as a workflow artifact with a manifest that pins each file to the
# source commit — the reviewer's proven native-file path (PR #365 comment
# 5784039055 §2). Same exporter as #403, same posture: ordinary pull_request
# job into this one branch, contents:read, pinned actions, persist-credentials
# false, inline stdlib packaging, nothing from the tree executed, nothing
# rendered or resized. This branch carries only this file on top of ff8c880
# and is never merged; it exists to run the job.
name: WSF visual-review export — #400 short-phone frames

on:
  pull_request:
    branches:
      - claude/wsf-fix-contribute-skip-timer
    paths:
      - '.github/workflows/wsf-visual-review-400-frames.yml'
      - 'docs/design-target/review/page-02-move/short-phone/**'

permissions:
  contents: read

concurrency:
  group: wsf-visual-review-400-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Export the pinned canonical images with a manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head commit exactly (not the merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Package original bytes + manifest (inline, stdlib only; nothing from the tree is executed)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          repo = os.environ['REPO']
          want = os.environ['SOURCE_SHA']
          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if head != want:
              sys.exit(f'checked-out HEAD {head} is not the PR head {want}')
          NS = 'docs/design-target/north-star-final'
          OWNER = 'docs/design-target/owner-north-star'
          # THE EXACT ALLOWLIST. Original committed bytes only; nothing outside it.
          SP = 'docs/design-target/review/page-02-move/short-phone'
          # THE EXACT ALLOWLIST: the twelve existing short-phone frames of PR #400,
          # original committed bytes only. before/ is the frozen e609c57 build,
          # after/ is the ff8c880 build; see short-phone/README.md.
          allow = [
              (f'{SP}/before/contribute-move-390x640.png', 'BEFORE (frozen) · e609c57 build · MOVE step at rest, 390x640'),
              (f'{SP}/before/contribute-move-390x664.png', 'BEFORE (frozen) · e609c57 build · MOVE step at rest, 390x664 — the proven at-rest occlusion'),
              (f'{SP}/before/contribute-move-390x844.png', 'BEFORE (frozen) · e609c57 build · MOVE step at rest, 390x844'),
              (f'{SP}/before/contribute-entry-390x640.png', 'BEFORE (frozen) · e609c57 build · amount entry, 390x640'),
              (f'{SP}/after/contribute-move-390x640.png', 'AFTER · ff8c880 build · MOVE step at rest, 390x640'),
              (f'{SP}/after/contribute-move-390x664.png', 'AFTER · ff8c880 build · MOVE step at rest, 390x664'),
              (f'{SP}/after/contribute-move-390x844.png', 'AFTER · ff8c880 build · MOVE step at rest, 390x844'),
              (f'{SP}/after/contribute-entry-390x640.png', 'AFTER · ff8c880 build · amount entry, 390x640'),
              (f'{SP}/after/contribute-review-390x640.png', 'AFTER · ff8c880 build · review, 390x640'),
              (f'{SP}/after/contribute-confirmed-390x640.png', 'AFTER · ff8c880 build · confirmed receipt, 390x640'),
              (f'{SP}/after/contribute-pending-390x640.png', 'AFTER · ff8c880 build · unknown outcome (pending), 390x640'),
              (f'{SP}/after/contribute-refused-390x640.png', 'AFTER · ff8c880 build · definitive refusal, 390x640'),
          ]
          PER_FILE_MAX = 8 * 1024 * 1024
          TOTAL_MAX = 24 * 1024 * 1024
          out = 'wsf-visual-review-400-frames'
          rows, total = [], 0
          for rel, label in allow:
              # Tracked as an ordinary regular file at this commit: mode 100644,
              # never a symlink (120000), submodule (160000) or executable.
              stage = git('ls-files', '--stage', '--', rel)
              if not stage:
                  sys.exit(f'not tracked at HEAD: {rel}')
              mode, blob = stage.split()[0], stage.split()[1]
              if mode != '100644':
                  sys.exit(f'refusing {rel}: tracked mode {mode}, not a regular file')
              if os.path.islink(rel) or not os.path.isfile(rel):
                  sys.exit(f'refusing {rel}: not a regular file in the checkout')
              if blob != git('rev-parse', f'HEAD:{rel}'):
                  sys.exit(f'index/HEAD disagree on {rel}')
              data = open(rel, 'rb').read()
              if len(data) > PER_FILE_MAX:
                  sys.exit(f'refusing {rel}: {len(data)} bytes exceeds the per-file bound')
              total += len(data)
              if total > TOTAL_MAX:
                  sys.exit(f'refusing: total exceeds the {TOTAL_MAX}-byte bound at {rel}')
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  sys.exit(f'not a PNG: {rel}')
              w, h = struct.unpack('>II', data[16:24])
              dest = os.path.join(out, rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copyfile(rel, dest)
              # The exported bytes must BE the committed blob: rehash the copy
              # with git's own object hashing and compare, not merely record it.
              copied = open(dest, 'rb').read()
              rehashed = git('hash-object', '--', dest)
              if rehashed != blob or hashlib.sha256(copied).digest() != hashlib.sha256(data).digest():
                  sys.exit(f'exported bytes for {rel} do not match the committed blob ({rehashed} vs {blob})')
              rows.append({'path': rel, 'label': label, 'git_blob_sha1': blob, 'bytes': len(data),
                           'sha256': hashlib.sha256(data).hexdigest(), 'width': w, 'height': h})
          manifest = {'repo': repo, 'source_sha': head, 'files_total_bytes': total,
                      'note': 'original bytes copied from this commit and re-hashed against the git blob; nothing rendered, resized or repaired',
                      'files': rows}
          json.dump(manifest, open(os.path.join(out, 'MANIFEST.json'), 'w'), indent=2)
          with open(os.path.join(out, 'MANIFEST.md'), 'w') as f:
              f.write(f'# PR #400 short-phone frames — visual review package\n\nRepository `{repo}` · source commit `{head}` · {len(rows)} files, {total} bytes · original bytes, re-hashed against git.\n\n')
              f.write('| path | label | git blob | bytes | sha256 | w×h |\n| --- | --- | --- | ---: | --- | --- |\n')
              for r in rows:
                  f.write(f"| `{r['path']}` | {r['label']} | `{r['git_blob_sha1']}` | {r['bytes']} | `{r['sha256']}` | {r['width']}×{r['height']} |\n")
          print(open(os.path.join(out, 'MANIFEST.md')).read())
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-visual-review-400-frames-${{ github.event.pull_request.head.sha }}
          path: wsf-visual-review-400-frames
          if-no-files-found: error
          retention-days: 7
          # The PNG is already compressed; keep its bytes verbatim inside the zip.
          compression-level: 0
