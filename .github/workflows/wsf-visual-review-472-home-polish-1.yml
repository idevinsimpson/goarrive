# WSF — visual-review export for PR #472, W9's HOME-POLISH-1 candidate
# (Director #365 5817775726; owner decision 5819686459 — the Lovable reference
# 544a385e / 872c32fc governs composition; the frozen frames live in that
# project, not in this repository): the nine MIGRATED and nine CANDIDATE PNGs
# W9 adds under docs/design-target/review/home-polish-1/ at its exact head
# (successor 07df4d0ff0e77f14a2f3d5720ebedddc77427688, product source 7588af6a,
# after the 30cb0740 / ccda4279 export the Director passed visually; W7's
# Check 27 routed as a delta; visual acceptance pending), plus the accepted Page 01 Home
# references, the accepted social-presence AFTER frames the Home destination
# already renders, and the owner's boards — exported as a workflow artifact with
# a manifest that pins each file to that commit (owner direction PR #365
# comment 5784428860 §3). Same exporter as #403 … #451 (#451's is the
# template), same posture: ordinary pull_request job into this one branch,
# contents:read, pinned actions, persist-credentials false, inline stdlib
# packaging, nothing from the tree executed, nothing rendered or resized. This
# branch carries only this file on top of W9's head and is never merged; it
# exists to run the job.
name: 'WSF visual-review export — #472 HOME-POLISH-1 (W9 candidate)'

on:
  pull_request:
    branches:
      - claude/wsf-w9-home-polish-1
    paths:
      - '.github/workflows/wsf-visual-review-472-home-polish-1.yml'
      - 'docs/design-target/review/home-polish-1/**'

permissions:
  contents: read

concurrency:
  group: wsf-visual-review-472-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Export the pinned canonical images with a manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head commit exactly (not the merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Package original bytes + manifest (inline, stdlib only; nothing from the tree is executed)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          repo = os.environ['REPO']
          want = os.environ['SOURCE_SHA']
          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if head != want:
              sys.exit(f'checked-out HEAD {head} is not the PR head {want}')
          # THE EXACT ALLOWLIST (unchanged paths; the CANDIDATE bytes are 7588af6a's): W9's 18 MIGRATED / CANDIDATE frames (every one
          # carrying its stage, served build and NOT ACCEPTED in an in-image strip;
          # none an AFTER) at the PR head this job checks out, original committed
          # bytes only; plus the accepted Page 01 Home TARGET / AFTER, the accepted
          # social-presence AFTER frames, and the owner's boards, for side-by-side
          # review only.
          allow = [
              ('docs/design-target/review/home-polish-1/MIGRATED-home-populated-390x844.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, populated · MIGRATED-home-populated-390x844.png'),
              ('docs/design-target/review/home-polish-1/MIGRATED-home-populated-390x640.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, populated, short phone · MIGRATED-home-populated-390x640.png'),
              ('docs/design-target/review/home-polish-1/MIGRATED-home-populated-scrolled-390x844.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, populated, scrolled · MIGRATED-home-populated-scrolled-390x844.png'),
              ('docs/design-target/review/home-polish-1/MIGRATED-home-quiet-390x844.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, quiet (a proven zero) · MIGRATED-home-quiet-390x844.png'),
              ('docs/design-target/review/home-polish-1/MIGRATED-home-quiet-390x640.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, quiet (a proven zero), short phone · MIGRATED-home-quiet-390x640.png'),
              ('docs/design-target/review/home-polish-1/MIGRATED-home-privacy-390x844.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, privacy (viewer + one member unnamed; one activity hidden) · MIGRATED-home-privacy-390x844.png'),
              ('docs/design-target/review/home-polish-1/MIGRATED-home-privacy-390x640.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, privacy (viewer + one member unnamed; one activity hidden), short phone · MIGRATED-home-privacy-390x640.png'),
              ('docs/design-target/review/home-polish-1/MIGRATED-home-stale-INJECTED-PULSE-FAILURE-390x844.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, progress failure, injected (named so) · MIGRATED-home-stale-INJECTED-PULSE-FAILURE-390x844.png'),
              ('docs/design-target/review/home-polish-1/MIGRATED-home-stale-INJECTED-PULSE-FAILURE-390x640.png', 'MIGRATED · NOT ACCEPTED · the route as it ships on the development base 018cd297, real build, synthetic fixture · community Home, progress failure, injected (named so), short phone · MIGRATED-home-stale-INJECTED-PULSE-FAILURE-390x640.png'),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-populated-390x844.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, populated · CANDIDATE-home-populated-390x844.png"),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-populated-390x640.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, populated, short phone · CANDIDATE-home-populated-390x640.png"),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-populated-scrolled-390x844.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, populated, scrolled · CANDIDATE-home-populated-scrolled-390x844.png"),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-quiet-390x844.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, quiet (a proven zero) · CANDIDATE-home-quiet-390x844.png"),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-quiet-390x640.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, quiet (a proven zero), short phone · CANDIDATE-home-quiet-390x640.png"),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-privacy-390x844.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, privacy (viewer + one member unnamed; one activity hidden) · CANDIDATE-home-privacy-390x844.png"),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-privacy-390x640.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, privacy (viewer + one member unnamed; one activity hidden), short phone · CANDIDATE-home-privacy-390x640.png"),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-stale-INJECTED-PULSE-FAILURE-390x844.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, progress failure, injected (named so) · CANDIDATE-home-stale-INJECTED-PULSE-FAILURE-390x844.png"),
              ('docs/design-target/review/home-polish-1/CANDIDATE-home-stale-INJECTED-PULSE-FAILURE-390x640.png', "CANDIDATE · NOT ACCEPTED · W9's recomposed route, product source ccda4279, real build, synthetic fixture · community Home, progress failure, injected (named so), short phone · CANDIDATE-home-stale-INJECTED-PULSE-FAILURE-390x640.png"),
              ('docs/design-target/review/page-01-home/TARGET-home-390x844.png', 'ACCEPTED TARGET reference (Page 01 Home) · TARGET-home-390x844.png'),
              ('docs/design-target/review/page-01-home/TARGET-home-390x640.png', 'ACCEPTED TARGET reference (Page 01 Home), short phone · TARGET-home-390x640.png'),
              ('docs/design-target/review/page-01-home/AFTER-home-390x844.png', 'ACCEPTED AFTER (Page 01 Home, historical copy — pre-shell, pre-presence) · AFTER-home-390x844.png'),
              ('docs/design-target/review/page-01-home/AFTER-home-390x640.png', 'ACCEPTED AFTER (Page 01 Home, historical copy — pre-shell, pre-presence), short phone · AFTER-home-390x640.png'),
              ('docs/design-target/review/community-presence/after/AFTER-community-390x844.png', "ACCEPTED AFTER (social community presence, 3e6a86b — the Home destination's accepted presence) · AFTER-community-390x844.png"),
              ('docs/design-target/review/community-presence/after/AFTER-community-390x640.png', 'ACCEPTED AFTER (social community presence), short phone · AFTER-community-390x640.png'),
              ('docs/design-target/owner-north-star/OWNER-BOARD-2-after-target-wsf-vision.png', "OWNER REFERENCE · the owner's after-target board · OWNER-BOARD-2-after-target-wsf-vision.png"),
              ('docs/design-target/owner-north-star/review-copies/CONCEPT-1-community-home.png', 'OWNER REFERENCE · concept 1, community home (review copy) · CONCEPT-1-community-home.png'),
          ]
          PER_FILE_MAX = 8 * 1024 * 1024
          TOTAL_MAX = 24 * 1024 * 1024
          out = 'wsf-visual-review-472-home-polish-1'
          rows, total = [], 0
          for rel, label in allow:
              stage = git('ls-files', '--stage', '--', rel)
              if not stage:
                  sys.exit(f'not tracked at HEAD: {rel}')
              mode, blob = stage.split()[0], stage.split()[1]
              if mode != '100644':
                  sys.exit(f'refusing {rel}: tracked mode {mode}, not a regular file')
              if os.path.islink(rel) or not os.path.isfile(rel):
                  sys.exit(f'refusing {rel}: not a regular file in the checkout')
              if blob != git('rev-parse', f'HEAD:{rel}'):
                  sys.exit(f'index/HEAD disagree on {rel}')
              data = open(rel, 'rb').read()
              if len(data) > PER_FILE_MAX:
                  sys.exit(f'refusing {rel}: {len(data)} bytes exceeds the per-file bound')
              total += len(data)
              if total > TOTAL_MAX:
                  sys.exit(f'refusing: total exceeds the {TOTAL_MAX}-byte bound at {rel}')
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  sys.exit(f'not a PNG: {rel}')
              w, h = struct.unpack('>II', data[16:24])
              dest = os.path.join(out, rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copyfile(rel, dest)
              copied = open(dest, 'rb').read()
              rehashed = git('hash-object', '--', dest)
              if rehashed != blob or hashlib.sha256(copied).digest() != hashlib.sha256(data).digest():
                  sys.exit(f'exported bytes for {rel} do not match the committed blob ({rehashed} vs {blob})')
              rows.append({'path': rel, 'label': label, 'git_blob_sha1': blob, 'bytes': len(data),
                           'sha256': hashlib.sha256(data).hexdigest(), 'width': w, 'height': h})
          manifest = {'repo': repo, 'source_sha': head, 'files_total_bytes': total,
                      'note': 'original bytes copied from this commit and re-hashed against the git blob; nothing rendered, resized or repaired',
                      'files': rows}
          json.dump(manifest, open(os.path.join(out, 'MANIFEST.json'), 'w'), indent=2)
          with open(os.path.join(out, 'MANIFEST.md'), 'w') as f:
              f.write(f'# PR #472 HOME-POLISH-1 (W9 candidate) — visual review package\n\nRepository `{repo}` · source commit `{head}` · {len(rows)} files, {total} bytes · original bytes, re-hashed against git.\n\n')
              f.write('| path | label | git blob | bytes | sha256 | w×h |\n| --- | --- | --- | ---: | --- | --- |\n')
              for r in rows:
                  f.write(f"| `{r['path']}` | {r['label']} | `{r['git_blob_sha1']}` | {r['bytes']} | `{r['sha256']}` | {r['width']}×{r['height']} |\n")
          print(open(os.path.join(out, 'MANIFEST.md')).read())
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-visual-review-472-home-polish-1-${{ github.event.pull_request.head.sha }}
          path: wsf-visual-review-472-home-polish-1
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
