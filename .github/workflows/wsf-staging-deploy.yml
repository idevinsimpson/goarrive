# We Stay Fit — staging deployment and hosted verification. Manual, staging only, keyless.
#
# WHY FIVE JOBS AND NOT ONE.
# `id-token: write` is a property of a JOB, not of a step. A job that holds it
# can mint a fresh OIDC token at any point, so moving the auth step later,
# clearing an environment variable or deleting the credentials file between
# steps does not take the capability away — it only makes the capability less
# visible. The only real boundary is a separate job on a separate runner. So
# dependency installation and the application build run in jobs that have no
# id-token permission at all, and cannot obtain one.
#
# WHAT EXECUTES WHERE. Not all of this is credential-isolated, and saying so
# plainly matters more than the claim would be worth:
#
#   gate, build        NO OIDC capability. These jobs cannot obtain a Google
#                      credential by any route, which is what makes them the
#                      right place for `npm ci` and the application build —
#                      third-party lifecycle scripts run where there is nothing
#                      to take.
#
#   deploy             PRIVILEGED, and it necessarily executes the pinned
#                      candidate's COMPILED FUNCTIONS CODE: `firebase deploy
#                      --only functions` spawns the source in a child process to
#                      discover its triggers (firebase-tools
#                      spawnFunctionsProcess). There is no way to deploy without
#                      that happening. The control is that the commit is pinned
#                      to a reviewed, approved SHA and the gate refuses anything
#                      else — pinning, not isolation.
#
#   hosted-verify      PRIVILEGED, and it executes reviewed operational harness
#                      code from this directory plus browser tooling pinned by
#                      the candidate's committed lockfile. It does not run the
#                      candidate's own application code directly; it drives the
#                      deployed site over HTTP.
#
# Privileged jobs install dependencies with --ignore-scripts, so package
# lifecycle code never runs alongside a credential.
name: WSF staging deploy

on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: "Optional confirmation. Must equal the approved candidate in .github/wsf-staging/approved-candidate.json. Leave blank to deploy the approved commit."
        required: false
        type: string
      # WHY THE BROWSER PROOF LIVES IN THIS FILE RATHER THAN ITS OWN.
      #
      # The workload identity provider pins
      #   assertion.workflow_ref == '…/.github/workflows/wsf-staging-deploy.yml@refs/heads/main'
      # (FEDERATION-PLAN.md). A separate workflow — however correct, however
      # deploy-free — can never authenticate through it, and the first attempt
      # failed at `config` with "The given credential is rejected by the
      # attribute condition" before any product code ran. Broadening the
      # condition or adding a second provider would widen the trust boundary
      # to buy a convenience, so the proof comes to the trusted file instead.
      #
      # `player-journey` deliberately skips build, deploy, the 24-row hosted
      # suite and deployment verification. It runs against staging exactly as
      # it already stands.
      mode:
        description: "deploy (default) runs the normal build/deploy/verify. player-journey runs ONLY the browser/player proof against staging as it stands — no build, no deploy, no 24-row suite."
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - player-journey
          - cleanup-recovery

      # WHY A RECOVERY MODE EXISTS.
      # Run 35495928362 created synthetic users and documents on staging and
      # then refused to delete them: the player journey minted `e5j-…` run tags
      # while cleanup-synthetic.mjs accepted `^e5h-` alone, so the manifest
      # identity check failed and the run ended MANIFEST_UNUSABLE with zero
      # deletions. The manifest was preserved in that run's evidence artifact,
      # which is exactly what recovery needs — but the journey must NOT be
      # re-run to get at it, because another journey creates more fixtures
      # before it can remove the old ones.
      #
      # `cleanup-recovery` therefore reads one earlier run's evidence artifact
      # and runs the cleaner against the manifest inside it. No journey, no
      # build, no deploy, no 24-row suite, no deployment verification.
      recover_run_id:
        description: "cleanup-recovery only. The workflow run id IN THIS REPOSITORY whose wsf-player-evidence artifact holds the manifest to clean up."
        required: false
        type: string

# Nothing is granted at workflow level. Each job takes only what it needs.
permissions: {}

concurrency:
  group: wsf-staging-deploy
  cancel-in-progress: false

env:
  STAGING_PROJECT: westayfit-staging
  STAGING_SITE: westayfit-staging
  STAGING_CHANNEL: staging
  STAGING_URL: https://westayfit-staging--staging-4a616y5m.web.app
  FIREBASE_TOOLS: firebase-tools@15.30.1
  WIF_PROVIDER: projects/857281977774/locations/global/workloadIdentityPools/wsf-staging-github/providers/github
  DEPLOY_SA: wsf-staging-deployer@westayfit-staging.iam.gserviceaccount.com

jobs:
  # ---------------------------------------------------------------- gate ----
  # No credentials and no candidate code. Decides what may be deployed before
  # anything is fetched or authenticated.
  gate:
    # The modes that act on the candidate. `cleanup-recovery` acts on one
    # earlier run's manifest and has no candidate to approve, so it must not
    # drag a gate (or the privileged config job behind it) along with it.
    # An explicit list, never a negation: a mode added later has to be named
    # here to get a credential.
    if: ${{ inputs.mode == 'deploy' || inputs.mode == 'player-journey' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app_sha: ${{ steps.candidate.outputs.app_sha }}
    steps:
      # github.sha is the exact commit this workflow run was dispatched from, so
      # the operational assets are pinned to one commit rather than read from a
      # branch that could move between steps.
      - name: Check out operational assets at the running workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve the approved candidate
        id: candidate
        env:
          WSF_REQUESTED_SHA: ${{ inputs.app_sha }}
        run: node .github/wsf-staging/resolve-candidate.mjs .github/wsf-staging/approved-candidate.json

  # -------------------------------------------------------------- config ----
  # Privileged, and deliberately tiny: it reads the staging Web App's public
  # SDK config and nothing else. No application code is checked out here, so
  # the credential is never in a workspace containing candidate code.
  config:
    needs: gate
    # Same list as the gate. A skipped `needs` already skips this job, but
    # stating the condition means the reachability of every privileged job can
    # be read off its own `if:` rather than inferred through the graph.
    if: ${{ inputs.mode == 'deploy' || inputs.mode == 'player-journey' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wsf-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pinned deployment tooling
        run: npm install --no-save --ignore-scripts "$FIREBASE_TOOLS"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Read the staging Web App SDK config
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase apps:sdkconfig WEB \
            --project "$STAGING_PROJECT" --json > sdkconfig.json
          node .github/wsf-staging/prepare-staging.mjs sdkconfig.json wsf-staging.env "$STAGING_PROJECT"
          rm -f sdkconfig.json

      # The six values are publishable client identifiers, but they are still
      # passed as an artifact rather than printed. The artifact is consumed by
      # the downstream build job (the web bundle) and by hosted-verify (the
      # SDK config file the smoke reads).
      - name: Upload the staging build configuration
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-staging-env
          path: wsf-staging.env
          retention-days: 1
          if-no-files-found: error

  # --------------------------------------------------------------- build ----
  # NO id-token. This job cannot obtain a Google credential by any means, which
  # is what makes it safe to run `npm ci` and the application build here.
  build:
    needs: [gate, config]
    # Deploy mode only. An equality on `deploy`, never `!= 'player-journey'`:
    # with a third mode in the input a negation quietly starts building for
    # every mode that is not the one it happens to name.
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the approved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.app_sha }}
          persist-credentials: false

      - name: Confirm the checkout is the approved commit
        env:
          APPROVED: ${{ needs.gate.outputs.app_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$APPROVED" ] || { echo "::error::checkout is $actual, expected $APPROVED"; exit 1; }
          echo "building $actual"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: wsf-staging-env

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      # Third-party lifecycle scripts run here, where there is nothing to steal.
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm --prefix apps/goarrive ci
          npm --prefix functions ci
          npm --prefix functions-westayfit ci
          npm --prefix apps/westayfit ci
          npm install --no-save --ignore-scripts "$FIREBASE_TOOLS"

      # The shared-rule risk is the reason a WSF-only deploy needs a GoArrive
      # regression. Check GoArrive's compiler and its complete Firestore rules
      # suite against the exact candidate before credentials or deployment.
      - name: Run the shared GoArrive regression
        run: |
          set -euo pipefail
          npm --prefix apps/goarrive run ts:check
          ./node_modules/.bin/firebase emulators:exec \
            --only firestore \
            --project demo-goarrive \
            "npm --prefix functions run test:rules"

      - name: Build functions
        run: npm --prefix functions-westayfit run build

      - name: Build the staging web artifact
        run: |
          set -euo pipefail
          rm -rf apps/westayfit/dist
          set -a; . ./wsf-staging.env; set +a
          export EXPO_PUBLIC_WSF_ENV=staging
          export EXPO_PUBLIC_WSF_AUTH_ENABLED=1
          scripts/westayfit/build-staging.sh --approved-project "$STAGING_PROJECT"
          scripts/westayfit/assert-staging-artifact.sh

      - name: Stamp and check the artifact against the approved commit
        env:
          APPROVED: ${{ needs.gate.outputs.app_sha }}
        run: |
          set -euo pipefail
          grep -rqF "${APPROVED:0:7}" apps/westayfit/dist --include=*.html \
            || { echo "::error::build marker does not match ${APPROVED:0:7}"; exit 1; }
          # Deliberately NOT a dotfile. actions/upload-artifact excludes hidden
          # files by default, so a .wsf-build-sha stamp would vanish in transit
          # and the deploy-side check would fail on a correct build. Enabling
          # hidden-file upload would fix the symptom by widening the artifact
          # surface; naming the file properly costs nothing.
          printf '%s\n' "$APPROVED" > apps/westayfit/dist/wsf-build-sha.txt
          printf '%s\n' "$APPROVED" > functions-westayfit/lib/wsf-build-sha.txt

      # Credential-boundary check runs BEFORE the upload, not after it.
      - name: Refuse to upload anything credential-shaped
        run: |
          set -euo pipefail
          bad="$(find apps/westayfit/dist functions-westayfit/lib \
                 \( -name 'gha-creds-*.json' -o -name '*.env' -o -name '*service-account*' \) 2>/dev/null || true)"
          [ -z "$bad" ] || { echo "::error::credential-shaped file in an upload path: $bad"; exit 1; }

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-build
          path: |
            apps/westayfit/dist
            functions-westayfit/lib
          retention-days: 3
          if-no-files-found: error

  # -------------------------------------------------------------- deploy ----
  deploy:
    needs: [gate, config, build]
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: wsf-staging
    permissions:
      contents: read
      id-token: write
    outputs:
      deployed_sha: ${{ needs.gate.outputs.app_sha }}
    steps:
      - name: Check out operational assets at the running workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false

      - name: Check out the approved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.app_sha }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: wsf-build
          path: app

      - name: Confirm the artifact belongs to the approved commit
        env:
          APPROVED: ${{ needs.gate.outputs.app_sha }}
        run: |
          set -euo pipefail
          node ops/.github/wsf-staging/check-build-stamp.mjs "$APPROVED" \
            app/apps/westayfit/dist/wsf-build-sha.txt \
            app/functions-westayfit/lib/wsf-build-sha.txt
          rm -f app/apps/westayfit/dist/wsf-build-sha.txt app/functions-westayfit/lib/wsf-build-sha.txt
          echo "artifact belongs to $APPROVED"

      # --ignore-scripts: this job holds id-token, so no package lifecycle code
      # runs here. The staging config declares no predeploy hook, so nothing is
      # rebuilt — lib/ comes from the unprivileged build job.
      - name: Install runtime dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          npm --prefix app/functions-westayfit ci --ignore-scripts
          npm install --no-save --ignore-scripts "$FIREBASE_TOOLS"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Read-only preflight before any change
        working-directory: app
        run: |
          set -euo pipefail
          cp ../ops/firebase.westayfit.staging.json .
          # A read-only call first: it proves the federated credential works
          # before anything is changed.
          ../node_modules/.bin/firebase projects:list --json > /dev/null

          # No `|| true`. The exit status is captured and handed to the reader,
          # which refuses to invent a baseline from a failed read.
          set +e
          ../node_modules/.bin/firebase functions:list \
            --project "$STAGING_PROJECT" --config firebase.westayfit.staging.json --json \
            > /tmp/functions-before-raw.json
          cli_status=$?
          set -e
          node ../ops/.github/wsf-staging/read-inventory.mjs \
            "$cli_status" /tmp/functions-before-raw.json /tmp/inventory-before.json \
            ../ops/.github/wsf-staging/approved-candidate.json

      # MAIL CONFIG, BEFORE THE DEPLOY THAT PACKAGES IT.
      #
      # readSendConfig() in functions-westayfit refuses to send unless
      # WSF_EMAIL_FROM, WSF_APP_URL and the WSF_EMAIL_API_KEY secret are all
      # present — which is why staging has been answering "not configured".
      # The two URLs are known and pinned here; the sender is account-specific
      # and comes from the environment variable, so a wrong address cannot be
      # guessed into a DMARC failure that burns the real domain.
      #
      # The file has to be a project-specific dotenv next to the functions
      # source: that is what firebase-tools packages into the deployed
      # runtime. An outer shell export configures the runner and deploys a
      # function that still refuses to send.
      - name: Write the functions runtime config
        id: functions-env
        working-directory: app
        env:
          WSF_EMAIL_FROM: ${{ vars.WSF_EMAIL_FROM }}
        run: |
          set -euo pipefail
          node ../ops/.github/wsf-staging/write-functions-env.mjs \
            "functions-westayfit/.env.$STAGING_PROJECT" \
            "$STAGING_PROJECT" \
            "$STAGING_URL" \
            "https://$STAGING_PROJECT.firebaseapp.com/__/auth/action"

      # PRESENCE ONLY, NEVER A PAYLOAD. Whether the secret exists and has an
      # enabled version decides whether this deploy can produce a build that
      # actually sends; `versions list` prints metadata and no material.
      # FOUR STATES, NEVER COLLAPSED. "I could not read it" is not "it is not
      # there": the previous shell `if` printed EXISTS=false on a
      # PERMISSION_DENIED, which would send an operator to create a second
      # secret beside a good one, or to widen IAM to make a diagnostic green.
      - name: Report the mail secret's state
        working-directory: app
        run: node ../ops/.github/wsf-staging/report-mail-secret.mjs "$STAGING_PROJECT" WSF_EMAIL_API_KEY

      - name: Deploy WSF functions
        id: deploy-functions
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          ../node_modules/.bin/firebase deploy \
            --project "$STAGING_PROJECT" \
            --config firebase.westayfit.staging.json \
            --only functions:westayfit \
            --non-interactive

      - name: Deploy the staging Hosting channel
        working-directory: app
        run: |
          set -euo pipefail
          ../node_modules/.bin/firebase hosting:channel:deploy "$STAGING_CHANNEL" \
            --project "$STAGING_PROJECT" \
            --config firebase.westayfit.staging.json \
            --expires 7d \
            --no-authorized-domains \
            --non-interactive

      # Re-auth: the federated token lasts an hour and the deploy above can
      # consume most of it.
      - name: Re-authenticate before verification
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Verify the deployed state
        env:
          WSF_APPROVED_SHA: ${{ needs.gate.outputs.app_sha }}
          WSF_INVENTORY_BEFORE: /tmp/inventory-before.json
          WSF_RESULT_DIR: ${{ github.workspace }}/wsf-evidence
        run: |
          set -euo pipefail
          export WSF_GOOGLE_ACCESS_TOKEN="$(gcloud auth print-access-token 2>/dev/null || true)"
          if [ -z "$WSF_GOOGLE_ACCESS_TOKEN" ]; then
            export WSF_GOOGLE_ACCESS_TOKEN="$(node -e '
              const {GoogleAuth} = require("google-auth-library");
              new GoogleAuth({scopes:["https://www.googleapis.com/auth/cloud-platform"]})
                .getAccessToken().then((t)=>process.stdout.write(t||""));
            ')"
          fi
          export WSF_STAGING_URL="$STAGING_URL"
          node ops/.github/wsf-staging/verify-deployment.mjs

      - name: Scan evidence before upload
        id: scan-deployment-evidence
        if: always()
        run: node ops/.github/wsf-staging/scan-evidence.mjs "${{ github.workspace }}/wsf-evidence"

      # Gated on the SCAN, not merely on always(). With `if: always()` alone a
      # scanner that found a credential would fail the step and the upload would
      # still run, publishing the very material the scan rejected.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ always() && steps.scan-deployment-evidence.outcome == 'success' }}
        with:
          name: wsf-deployment-evidence
          path: wsf-evidence
          retention-days: 7
          if-no-files-found: error

      # Hosting is a safe, useful staging increment even when the deployer
      # cannot set public invoker IAM on newly created services. Preserve that
      # failure after publishing and verifying the reviewed web artifact.
      - name: Preserve an incomplete functions deployment as a failed release
        if: ${{ always() && steps.deploy-functions.outcome == 'failure' }}
        run: |
          echo "::error::WSF functions were not fully deployed; hosting may be visible but callable transport remains blocked."
          exit 1

  # ------------------------------------------------------- hosted-verify ----
  # The assignment is reviewed source -> deployment -> HOSTED verification ->
  # evidence. A green deploy with the behaviour unassigned is not the deliverable.
  #
  # Privileged, because synthetic fixture setup and cleanup need admin REST
  # calls. The authorization assertions themselves do NOT use that access: the
  # synthetic users sign in through the public Identity Toolkit endpoints with
  # the Web App's API key and act as themselves in a real browser.
  hosted-verify:
    needs: [gate, deploy]
    # `always()` keeps this reachable when the deploy step soft-failed, but it
    # must not run at all outside deploy mode — this is the 24-row suite.
    if: ${{ always() && needs.gate.result == 'success' && inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: wsf-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out operational assets at the running workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false

      - name: Check out the deployed candidate (for its Playwright dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.app_sha }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # This job holds id-token: write, so it must not run a package-resolution
      # path that can reach the registry for something not in the lockfile.
      # `npx --yes playwright ...` would do exactly that: with @playwright/test
      # installed but no `playwright` binary resolvable, npx silently fetches a
      # `playwright` package from the registry and runs it. The CLI used here is
      # the one the accepted candidate's committed lockfile installed.
      - name: Install candidate dependencies without lifecycle scripts
        working-directory: app
        run: npm --prefix apps/westayfit ci --ignore-scripts

      # The REST fixture token is minted through google-auth-library. The deploy
      # job has it only as a transitive dependency of the pinned firebase-tools
      # install; this job had neither, so the first hosted run failed before a
      # single fixture was created. Same pinned tooling, same --ignore-scripts.
      - name: Install pinned deployment tooling
        run: npm install --no-save --ignore-scripts "$FIREBASE_TOOLS"

      - name: Install browsers using the candidate's pinned Playwright CLI
        working-directory: app
        run: |
          set -euo pipefail
          PW="apps/westayfit/node_modules/.bin/playwright"
          [ -x "$PW" ] || { echo "::error::the candidate's Playwright CLI is not present at $PW"; exit 1; }
          # Prove the binary belongs to the candidate installation rather than a
          # registry download, and record the version in the log.
          resolved="$(node -e '
            const {createRequire} = require("node:module");
            const req = createRequire(require("path").resolve("apps/westayfit/package.json"));
            console.log(req.resolve("@playwright/test/package.json"));
          ')"
          case "$resolved" in
            "$PWD/apps/westayfit/node_modules/"*) : ;;
            *) echo "::error::@playwright/test resolved outside the candidate installation: $resolved"; exit 1 ;;
          esac
          echo "PLAYWRIGHT_CLI=$PW"
          echo "PLAYWRIGHT_PACKAGE=$resolved"
          echo "PLAYWRIGHT_VERSION=$("$PW" --version)"
          "$PW" install --with-deps chromium

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: wsf-staging-env
          path: cfg

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Run the Package E hosted authorization checks
        id: smoke
        working-directory: app
        env:
          WSF_APPROVED_SHA: ${{ needs.gate.outputs.app_sha }}
          WSF_STAGING_URL: https://westayfit-staging--staging-4a616y5m.web.app
          WSF_RESULT_DIR: ${{ github.workspace }}/wsf-evidence
          WSF_CLEANUP_MANIFEST: ${{ github.workspace }}/wsf-evidence/cleanup-manifest.json
        run: |
          set -euo pipefail
          set -a; . ../cfg/wsf-staging.env; set +a
          export WSF_STAGING_API_KEY="$EXPO_PUBLIC_WSF_STAGING_API_KEY"
          # The smoke reads its project id and Web API key from a JSON file,
          # not from WSF_STAGING_API_KEY. Re-shape the values the env artifact
          # already carries into a dedicated child of the runner's temp
          # directory (outside the checkout and the evidence directory). The
          # writer creates that child itself at 0700 — mkdir's mode never
          # re-chmods an existing directory, so RUNNER_TEMP itself would not
          # carry the invariant — and the file is 0600, never echoed.
          export WSF_SDK_CONFIG_FILE="$RUNNER_TEMP/wsf-sdk/wsf-sdk-config.json"
          node ../ops/.github/wsf-staging/write-sdk-config.mjs "$WSF_SDK_CONFIG_FILE" "$STAGING_PROJECT"
          export WSF_GOOGLE_ACCESS_TOKEN="$(node -e '
            const {GoogleAuth} = require("google-auth-library");
            new GoogleAuth({scopes:["https://www.googleapis.com/auth/cloud-platform"]})
              .getAccessToken().then((t)=>process.stdout.write(t||""));
          ')"
          node ../ops/.github/wsf-staging/hosted-package-e-smoke.mjs

      # Cleanup runs whatever the smoke did, and re-authenticates first because
      # the smoke can outlive the token that started it.
      - name: Re-authenticate before cleanup
        if: always()
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Remove synthetic fixtures
        if: always()
        env:
          WSF_CLEANUP_MANIFEST: ${{ github.workspace }}/wsf-evidence/cleanup-manifest.json
          WSF_CLEANUP_RECEIPT: ${{ github.workspace }}/wsf-evidence/cleanup-receipt.json
        run: |
          set -euo pipefail
          export WSF_GOOGLE_ACCESS_TOKEN="$(node -e '
            const {GoogleAuth} = require("google-auth-library");
            new GoogleAuth({scopes:["https://www.googleapis.com/auth/cloud-platform"]})
              .getAccessToken().then((t)=>process.stdout.write(t||""));
          ')"
          node ops/.github/wsf-staging/cleanup-synthetic.mjs

      # Redacting scan, BEFORE the upload rather than after it.
      - name: Scan evidence before upload
        id: scan-hosted-evidence
        if: always()
        run: node ops/.github/wsf-staging/scan-evidence.mjs "${{ github.workspace }}/wsf-evidence"

      # Same gate as the deployment job: rejected evidence is never uploaded.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ always() && steps.scan-hosted-evidence.outcome == 'success' }}
        with:
          name: wsf-hosted-evidence
          path: wsf-evidence
          retention-days: 7
          if-no-files-found: error

      # An incomplete or failed hosted check must not leave a green run.
      - name: Require the hosted checks to have passed
        if: always()
        run: |
          set -euo pipefail
          [ "${{ steps.smoke.outcome }}" = "success" ] \
            || { echo "::error::hosted verification did not pass — the deployment is NOT verified"; exit 1; }
          [ "${{ steps.scan-hosted-evidence.outcome }}" = "success" ] \
            || { echo "::error::evidence scan rejected the hosted evidence; it was not uploaded and this run is not verified"; exit 1; }

  # ------------------------------------------------------ player-journey ----
  # The browser/player proof, against staging AS IT ALREADY STANDS.
  #
  # WHY IT IS A MODE OF THIS FILE AND NOT ITS OWN WORKFLOW.
  # The workload identity provider's attribute condition pins
  #   assertion.workflow_ref == '…/.github/workflows/wsf-staging-deploy.yml@refs/heads/main'
  # (FEDERATION-PLAN.md). A standalone workflow — however deploy-free — can
  # never authenticate through it: the first attempt failed at `config` with
  # "unauthorized_client: The given credential is rejected by the attribute
  # condition" before any product code ran. Widening that condition, or adding
  # a second provider, would enlarge the trust boundary to buy a convenience.
  # So the proof comes to the trusted file instead.
  #
  # WHAT IT DOES NOT DO. It does not build the candidate, does not deploy
  # anything, and does not run the 24-row hosted authorization suite: `build`,
  # `deploy` and `hosted-verify` are all skipped in this mode. It depends on
  # `gate` (which approves the SHA and holds no credential) and on `config`
  # (which reads the public Web App SDK config), exactly as the deploy path
  # does, and on nothing else.
  #
  # Privileged, because seeding and removing the synthetic fixtures needs admin
  # REST calls. The player assertions themselves do not use that access: the
  # synthetic identities sign in through public Identity Toolkit endpoints with
  # the Web App's API key and act as themselves in a real browser.
  #
  # EVIDENCE INDEPENDENCE. This job's cleanup manifest, evidence directory and
  # uploaded artifact are its own (`wsf-player-evidence`), never the hosted
  # suite's (`wsf-evidence` / `wsf-hosted-evidence`). Two runs sharing one
  # manifest would let one run's cleanup adopt or destroy the other's record of
  # what it created. The two jobs are mutually exclusive by `mode`, and the
  # names stay separate anyway so that a future change to either cannot make
  # them collide silently.
  player-journey:
    needs: [gate, config]
    if: ${{ inputs.mode == 'player-journey' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: wsf-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out operational assets at the running workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false

      # The candidate is checked out for its pinned Playwright ONLY. Nothing
      # here builds or deploys it; the build under test is the one already
      # serving on the staging channel.
      - name: Check out the deployed candidate (for its Playwright dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.app_sha }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install candidate dependencies without lifecycle scripts
        working-directory: app
        run: npm --prefix apps/westayfit ci --ignore-scripts

      - name: Install pinned deployment tooling
        run: npm install --no-save --ignore-scripts "$FIREBASE_TOOLS"

      # Same reasoning as hosted-verify: this job holds id-token: write, so the
      # Playwright CLI must be the candidate's own, never a registry download
      # `npx --yes` would fetch.
      - name: Install browsers using the candidate's pinned Playwright CLI
        working-directory: app
        run: |
          set -euo pipefail
          PW="apps/westayfit/node_modules/.bin/playwright"
          [ -x "$PW" ] || { echo "::error::the candidate's Playwright CLI is not present at $PW"; exit 1; }
          resolved="$(node -e '
            const {createRequire} = require("node:module");
            const req = createRequire(require("path").resolve("apps/westayfit/package.json"));
            console.log(req.resolve("@playwright/test/package.json"));
          ')"
          case "$resolved" in
            "$PWD/apps/westayfit/node_modules/"*) : ;;
            *) echo "::error::@playwright/test resolved outside the candidate installation: $resolved"; exit 1 ;;
          esac
          echo "PLAYWRIGHT_CLI=$PW"
          echo "PLAYWRIGHT_PACKAGE=$resolved"
          echo "PLAYWRIGHT_VERSION=$("$PW" --version)"
          # Chromium only. WebKit is not Safari and this proof never says it is.
          "$PW" install --with-deps chromium

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: wsf-staging-env
          path: cfg

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Run the browser/player journey
        id: journey
        working-directory: app
        env:
          WSF_APPROVED_SHA: ${{ needs.gate.outputs.app_sha }}
          WSF_STAGING_URL: https://westayfit-staging--staging-4a616y5m.web.app
          WSF_RESULT_DIR: ${{ github.workspace }}/wsf-player-evidence
          WSF_CLEANUP_MANIFEST: ${{ github.workspace }}/wsf-player-evidence/cleanup-manifest.json
        run: |
          set -euo pipefail
          set -a; . ../cfg/wsf-staging.env; set +a
          export WSF_SDK_CONFIG_FILE="$RUNNER_TEMP/wsf-sdk/wsf-sdk-config.json"
          node ../ops/.github/wsf-staging/write-sdk-config.mjs "$WSF_SDK_CONFIG_FILE" "$STAGING_PROJECT"
          export WSF_GOOGLE_ACCESS_TOKEN="$(node -e '
            const {GoogleAuth} = require("google-auth-library");
            new GoogleAuth({scopes:["https://www.googleapis.com/auth/cloud-platform"]})
              .getAccessToken().then((t)=>process.stdout.write(t||""));
          ')"
          node ../ops/.github/wsf-staging/hosted-player-journey.mjs

      # Cleanup runs whatever the journey did, and re-authenticates first
      # because a browser journey can outlive the token that started it.
      - name: Re-authenticate before cleanup
        if: always()
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Remove synthetic fixtures
        if: always()
        env:
          WSF_CLEANUP_MANIFEST: ${{ github.workspace }}/wsf-player-evidence/cleanup-manifest.json
          WSF_CLEANUP_RECEIPT: ${{ github.workspace }}/wsf-player-evidence/cleanup-receipt.json
        run: |
          set -euo pipefail
          export WSF_GOOGLE_ACCESS_TOKEN="$(node -e '
            const {GoogleAuth} = require("google-auth-library");
            new GoogleAuth({scopes:["https://www.googleapis.com/auth/cloud-platform"]})
              .getAccessToken().then((t)=>process.stdout.write(t||""));
          ')"
          node ops/.github/wsf-staging/cleanup-synthetic.mjs

      # Redacting scan BEFORE the upload. Rejected evidence is never uploaded.
      - name: Scan evidence before upload
        id: scan-player-evidence
        if: always()
        run: node ops/.github/wsf-staging/scan-evidence.mjs "${{ github.workspace }}/wsf-player-evidence"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ always() && steps.scan-player-evidence.outcome == 'success' }}
        with:
          name: wsf-player-evidence
          path: wsf-player-evidence
          retention-days: 7
          if-no-files-found: error

      # WHY THE FAILING ROWS ARE REPRINTED HERE. The journey already prints its
      # FAIL rows, but in ITS OWN step — and a reader whose log access returns
      # only the tail of a job (the case for the agent driving these runs, and
      # for anyone reading a long job on a slow connection) cannot reach a step
      # that finished several steps ago. Runs 37, 38 and 39 were each diagnosed
      # from which CAPTURE was missing and how long the step took, because the
      # actual assertion message was unreadable. That is a bad way to debug.
      #
      # This reprints the failing rows from the receipt in the LAST step of the
      # job, where the tail always reaches. It changes no gate and no outcome:
      # the exit codes below are exactly as before.
      - name: Reprint the journey's failing rows where the log tail can reach them
        if: always() && steps.journey.outcome != 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          receipt="${{ github.workspace }}/wsf-player-evidence/player-journey-receipt.json"
          if [ -f "$receipt" ]; then
            echo "--- journey FAIL rows (reprinted from $(basename "$receipt")) ---"
            node -e '
              const fs = require("fs");
              const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const bad = (r.results || []).filter((x) => x.status !== "PASS");
              if (!bad.length) { console.log("(receipt records no failing row)"); }
              for (const row of bad) console.log(`${row.status} ${row.name} — ${row.detail}`);
              console.log(`CAPTURES_IN_RECEIPT=${(r.captures || []).length}`);
            ' "$receipt"
          else
            echo "(no receipt written — the journey died before it could record one)"
          fi

      # An incomplete or failed journey must not leave a green run, and neither
      # must evidence the scanner rejected.
      - name: Require the journey and the scan to have passed
        if: always()
        run: |
          set -euo pipefail
          [ "${{ steps.journey.outcome }}" = "success" ] \
            || { echo "::error::the browser/player journey did not pass"; exit 1; }
          [ "${{ steps.scan-player-evidence.outcome }}" = "success" ] \
            || { echo "::error::the evidence scan rejected this run's evidence"; exit 1; }

  # ----------------------------------------------------- cleanup-recovery ----
  # Remove the synthetic fixtures an EARLIER run created and could not remove
  # itself.
  #
  # WHY THIS IS NOT "just run the journey again".
  # Run 35495928362 created three synthetic accounts and their documents, then
  # ended `MANIFEST_UNUSABLE: manifest identity check failed` and deleted
  # nothing — the journey minted `e5j-…` run tags while the cleaner accepted
  # `^e5h-` alone. Re-running the journey would create a second set of fixtures
  # before touching the first. What that run DID leave is its manifest, inside
  # the `wsf-player-evidence` artifact it uploaded, and a manifest is precisely
  # the record the cleaner needs.
  #
  # WHAT IT IS ALLOWED TO DO. Read one named run's artifact from THIS
  # repository, validate the manifest inside it, delete exactly what that
  # manifest names, read back, and publish the receipt. It does not build,
  # deploy, open a browser, run the 24-row suite, verify a deployment, or
  # create a single fixture of its own.
  #
  # THE MANIFEST IS INPUT, NOT A TRUSTED FACT. It arrives from a run id an
  # operator types in, so `validate-recovery-manifest.mjs` gates it before the
  # credential is used (staging project exactly; a run tag this repository's
  # harnesses own; the shapes the cleaner expects; no absolute or traversing
  # paths) and prints the scope. `cleanup-synthetic.mjs` then validates every
  # identifier's provenance individually and refuses the whole manifest on one
  # bad entry, as it always has.
  #
  # No `needs`: there is no candidate to approve and no SDK config to read, so
  # neither `gate` nor `config` has anything to contribute here.
  cleanup-recovery:
    if: ${{ inputs.mode == 'cleanup-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: wsf-staging
    permissions:
      # actions: read is what lets download-artifact reach ANOTHER run's
      # artifact in this repository. It is the only addition over the other
      # privileged jobs, and it is read-only.
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out operational assets at the running workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # google-auth-library, same as every other job that mints a REST token.
      - name: Install pinned deployment tooling
        run: npm install --no-save --ignore-scripts "$FIREBASE_TOOLS"

      # Checked BEFORE the download, so a malformed id fails on its own terms
      # rather than as a confusing artifact error.
      - name: Require a plain numeric run id
        id: recover-target
        env:
          REQUESTED: ${{ inputs.recover_run_id }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            '') echo "::error::cleanup-recovery needs recover_run_id: the run whose wsf-player-evidence artifact holds the manifest"; exit 1 ;;
            *[!0-9]*) echo "::error::recover_run_id must be a plain workflow run id (digits only)"; exit 1 ;;
          esac
          echo "RECOVERY_SOURCE_RUN=$REQUESTED"
          echo "run_id=$REQUESTED" >> "$GITHUB_OUTPUT"

      # No `repository:` input — the artifact comes from this repository by
      # construction, so the mode cannot be pointed at another repo's run.
      - name: Fetch that run's evidence artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: wsf-player-evidence
          run-id: ${{ steps.recover-target.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: recovered

      - name: Validate the recovered manifest before using a credential
        run: node ops/.github/wsf-staging/validate-recovery-manifest.mjs recovered/cleanup-manifest.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Remove the fixtures that run left behind
        id: recover
        env:
          WSF_CLEANUP_MANIFEST: ${{ github.workspace }}/recovered/cleanup-manifest.json
          WSF_CLEANUP_RECEIPT: ${{ github.workspace }}/wsf-recovery-evidence/cleanup-receipt.json
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/wsf-recovery-evidence"
          export WSF_GOOGLE_ACCESS_TOKEN="$(node -e '
            const {GoogleAuth} = require("google-auth-library");
            new GoogleAuth({scopes:["https://www.googleapis.com/auth/cloud-platform"]})
              .getAccessToken().then((t)=>process.stdout.write(t||""));
          ')"
          node ops/.github/wsf-staging/cleanup-synthetic.mjs

      # The manifest the cleaner preserved on an INCOMPLETE pass is the only
      # record of what is still out there, so it travels with the receipt.
      - name: Preserve the manifest alongside the receipt
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/wsf-recovery-evidence"
          if [ -f "${{ github.workspace }}/recovered/cleanup-manifest.json" ]; then
            cp "${{ github.workspace }}/recovered/cleanup-manifest.json" \
               "${{ github.workspace }}/wsf-recovery-evidence/cleanup-manifest.json"
            echo "RECOVERY_MANIFEST_RETAINED=true"
          else
            echo "RECOVERY_MANIFEST_RETAINED=false  (the cleaner removed it, which it does only on COMPLETE)"
          fi

      # Redacting scan BEFORE the upload, same gate as every other evidence path.
      - name: Scan evidence before upload
        id: scan-recovery-evidence
        if: always()
        run: node ops/.github/wsf-staging/scan-evidence.mjs "${{ github.workspace }}/wsf-recovery-evidence"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ always() && steps.scan-recovery-evidence.outcome == 'success' }}
        with:
          name: wsf-cleanup-recovery-evidence
          path: wsf-recovery-evidence
          retention-days: 30
          if-no-files-found: error

      # A recovery that did not actually finish must never read as one. The
      # cleaner exits non-zero on INCOMPLETE and MANIFEST_UNUSABLE, and the
      # receipt is read as well as the exit code: a green step with a receipt
      # that does not say COMPLETE (or NO_FIXTURES, when there was nothing to
      # remove) is not a recovery.
      - name: Require the recovery to have completed
        if: always()
        env:
          RECEIPT: ${{ github.workspace }}/wsf-recovery-evidence/cleanup-receipt.json
        run: |
          set -euo pipefail
          [ "${{ steps.scan-recovery-evidence.outcome }}" = "success" ] \
            || { echo "::error::the evidence scan rejected the recovery evidence"; exit 1; }
          [ -f "$RECEIPT" ] || { echo "::error::no cleanup receipt was written; the recovery is not established"; exit 1; }
          status="$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.env.RECEIPT,"utf8")).status||""))')"
          echo "RECOVERY_CLEANUP_STATUS=$status"
          case "$status" in
            COMPLETE|NO_FIXTURES) : ;;
            *) echo "::error::cleanup reported $status; fixtures may remain on staging and the manifest is preserved in wsf-cleanup-recovery-evidence"; exit 1 ;;
          esac
          [ "${{ steps.recover.outcome }}" = "success" ] \
            || { echo "::error::the cleanup step failed even though the receipt reads $status"; exit 1; }
