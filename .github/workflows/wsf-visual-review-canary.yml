# WSF — visual-review export: the pinned canonical North Star images as a
# workflow artifact, with a manifest that pins each file to the source commit.
# (Grown from the one-file canary the reviewer opened at 80eda53.)
#
# Why: the Program Director's reviewer can open a native file it downloads
# from a workflow-run artifact, and cannot open a PNG served as base64 text
# or a raw/attachment URL (PR #392 comment 5783640173). This is the one-file
# proof of that round trip for the CURRENT canonical package. Nothing is
# rendered, resized, built, installed, deployed or fetched; no code from the
# checked-out tree is executed — the packaging is this file's own inline
# python, standard library only.
#
# Smallest surface, on purpose: an ordinary pull_request job on PRs into the
# canonical docs branch only (never pull_request_target), contents:read, no
# id-token / environment / secrets, the repo's pinned actions,
# persist-credentials false, standard runner, 5-minute timeout, 7-day
# retention, no schedule, no dispatch.
name: WSF visual-review export

on:
  pull_request:
    branches:
      - claude/wsf-north-star-canonical
    paths:
      - '.github/workflows/wsf-visual-review-canary.yml'
      - 'docs/design-target/north-star-final/**'
      - 'docs/design-target/owner-north-star/**'

permissions:
  contents: read

concurrency:
  group: wsf-visual-review-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Export the pinned canonical images with a manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head commit exactly (not the merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Package original bytes + manifest (inline, stdlib only; nothing from the tree is executed)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          repo = os.environ['REPO']
          want = os.environ['SOURCE_SHA']
          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if head != want:
              sys.exit(f'checked-out HEAD {head} is not the PR head {want}')
          NS = 'docs/design-target/north-star-final'
          OWNER = 'docs/design-target/owner-north-star'
          # THE EXACT ALLOWLIST. Original committed bytes only; nothing outside it.
          allow = [
              (f'{OWNER}/OWNER-BOARD-1-before-current-wsf-experience.png', 'OWNER BOARD (owner-supplied) · before: current WSF experience'),
              (f'{OWNER}/OWNER-BOARD-2-after-target-wsf-vision.png', 'OWNER BOARD (owner-supplied) · after / target: WSF vision'),
              (f'{NS}/INDEX.png', 'INDEX · navigation contact sheet rendered from the package directory (2x)'),
              (f'{NS}/board-00/WE_STAY_FIT_NORTH_STAR_BOARD_00_BRAND_FOUNDATION_FINAL.png', 'CANONICAL BOARD 00 · reconstructed reference (2x) · status per north-star-final/README.md'),
              (f'{NS}/board-01/WE_STAY_FIT_NORTH_STAR_BOARD_01_HOME_FINAL.png', 'CANONICAL BOARD 01 · current-build composite: real captures + labelled target/seam (2x) · status per README'),
              (f'{NS}/board-02/WE_STAY_FIT_NORTH_STAR_BOARD_02_MOVE_FINAL.png', 'CANONICAL BOARD 02 · accepted frames read in place + two captures (2x) · status per README'),
              (f'{NS}/board-03/WE_STAY_FIT_NORTH_STAR_BOARD_03_COMMUNITY_FINAL.png', 'CANONICAL BOARD 03 · accepted frames read in place (2x) · status per README'),
              (f'{NS}/board-04/WE_STAY_FIT_NORTH_STAR_BOARD_04_PROGRESS_FINAL.png', 'CANONICAL BOARD 04 · accepted frames read in place (2x) · status per README'),
              (f'{NS}/board-05/WE_STAY_FIT_NORTH_STAR_BOARD_05_YOU_FINAL.png', 'CANONICAL BOARD 05 · accepted frames read in place (2x) · status per README'),
              (f'{NS}/board-06/WE_STAY_FIT_NORTH_STAR_BOARD_06_CREATE_JOIN_AUTH_FINAL.png', 'Board 06 · create / join / auth · REVIEWED 2026-09-22 (PR #404 comment 5784845039) · original 2x'),
              (f'{NS}/review-copies/WE_STAY_FIT_NORTH_STAR_INDEX_REVIEW_1x.png', 'REVIEW COPY · INDEX at 1x, same module (WSF_BOARD_SCALE=1)'),
              (f'{NS}/review-copies/WE_STAY_FIT_NORTH_STAR_BOARD_00_BRAND_FOUNDATION_FINAL_REVIEW_1x.png', 'REVIEW COPY · Board 00 at 1x, same module'),
              (f'{NS}/review-copies/WE_STAY_FIT_NORTH_STAR_BOARD_01_HOME_FINAL_REVIEW_1x.png', 'REVIEW COPY · Board 01 at 1x, same module'),
              (f'{NS}/review-copies/WE_STAY_FIT_NORTH_STAR_BOARD_02_MOVE_FINAL_REVIEW_1x.png', 'REVIEW COPY · Board 02 at 1x, same module'),
              (f'{NS}/review-copies/WE_STAY_FIT_NORTH_STAR_BOARD_03_COMMUNITY_FINAL_REVIEW_1x.png', 'REVIEW COPY · Board 03 at 1x, same module'),
              (f'{NS}/review-copies/WE_STAY_FIT_NORTH_STAR_BOARD_04_PROGRESS_FINAL_REVIEW_1x.png', 'REVIEW COPY · Board 04 at 1x, same module'),
              (f'{NS}/review-copies/WE_STAY_FIT_NORTH_STAR_BOARD_05_YOU_FINAL_REVIEW_1x.png', 'REVIEW COPY · Board 05 at 1x, same module'),
              (f'{NS}/review-copies/WE_STAY_FIT_NORTH_STAR_BOARD_06_CREATE_JOIN_AUTH_FINAL_REVIEW_1x.png', 'Board 06 · 1x review copy'),
          ]
          PER_FILE_MAX = 8 * 1024 * 1024
          TOTAL_MAX = 24 * 1024 * 1024
          out = 'wsf-visual-review'
          rows, total = [], 0
          for rel, label in allow:
              # Tracked as an ordinary regular file at this commit: mode 100644,
              # never a symlink (120000), submodule (160000) or executable.
              stage = git('ls-files', '--stage', '--', rel)
              if not stage:
                  sys.exit(f'not tracked at HEAD: {rel}')
              mode, blob = stage.split()[0], stage.split()[1]
              if mode != '100644':
                  sys.exit(f'refusing {rel}: tracked mode {mode}, not a regular file')
              if os.path.islink(rel) or not os.path.isfile(rel):
                  sys.exit(f'refusing {rel}: not a regular file in the checkout')
              if blob != git('rev-parse', f'HEAD:{rel}'):
                  sys.exit(f'index/HEAD disagree on {rel}')
              data = open(rel, 'rb').read()
              if len(data) > PER_FILE_MAX:
                  sys.exit(f'refusing {rel}: {len(data)} bytes exceeds the per-file bound')
              total += len(data)
              if total > TOTAL_MAX:
                  sys.exit(f'refusing: total exceeds the {TOTAL_MAX}-byte bound at {rel}')
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  sys.exit(f'not a PNG: {rel}')
              w, h = struct.unpack('>II', data[16:24])
              dest = os.path.join(out, rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copyfile(rel, dest)
              # The exported bytes must BE the committed blob: rehash the copy
              # with git's own object hashing and compare, not merely record it.
              copied = open(dest, 'rb').read()
              rehashed = git('hash-object', '--', dest)
              if rehashed != blob or hashlib.sha256(copied).digest() != hashlib.sha256(data).digest():
                  sys.exit(f'exported bytes for {rel} do not match the committed blob ({rehashed} vs {blob})')
              rows.append({'path': rel, 'label': label, 'git_blob_sha1': blob, 'bytes': len(data),
                           'sha256': hashlib.sha256(data).hexdigest(), 'width': w, 'height': h})
          manifest = {'repo': repo, 'source_sha': head, 'files_total_bytes': total,
                      'note': 'original bytes copied from this commit and re-hashed against the git blob; nothing rendered, resized or repaired',
                      'files': rows}
          json.dump(manifest, open(os.path.join(out, 'MANIFEST.json'), 'w'), indent=2)
          with open(os.path.join(out, 'MANIFEST.md'), 'w') as f:
              f.write(f'# WE STAY FIT North Star — visual review package\n\nRepository `{repo}` · source commit `{head}` · {len(rows)} files, {total} bytes · original bytes, re-hashed against git.\n\n')
              f.write('| path | label | git blob | bytes | sha256 | w×h |\n| --- | --- | --- | ---: | --- | --- |\n')
              for r in rows:
                  f.write(f"| `{r['path']}` | {r['label']} | `{r['git_blob_sha1']}` | {r['bytes']} | `{r['sha256']}` | {r['width']}×{r['height']} |\n")
          print(open(os.path.join(out, 'MANIFEST.md')).read())
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-visual-review-${{ github.event.pull_request.head.sha }}
          path: wsf-visual-review
          if-no-files-found: error
          retention-days: 7
          # The PNG is already compressed; keep its bytes verbatim inside the zip.
          compression-level: 0
