# WSF — visual-review canary: export ONE existing committed PNG as a workflow
# artifact, with a manifest that pins it to the source commit.
#
# Why: the Program Director's reviewer can open a native file it downloads
# from a workflow-run artifact, and cannot open a PNG served as base64 text
# or a raw/attachment URL (PR #392 comment 5783640173). This is the one-file
# proof of that round trip for the CURRENT canonical package. Nothing is
# rendered, resized, built, installed, deployed or fetched; no code from the
# checked-out tree is executed — the packaging is this file's own inline
# python, standard library only.
#
# Smallest surface, on purpose: an ordinary pull_request job on PRs into the
# canonical docs branch only (never pull_request_target), contents:read, no
# id-token / environment / secrets, the repo's pinned actions,
# persist-credentials false, standard runner, 5-minute timeout, 7-day
# retention, no schedule, no dispatch.
name: WSF visual-review canary

on:
  pull_request:
    branches:
      - claude/wsf-north-star-canonical
    paths:
      - '.github/workflows/wsf-visual-review-canary.yml'
      - 'docs/design-target/north-star-final/**'
      - 'docs/design-target/owner-north-star/**'

permissions:
  contents: read

concurrency:
  group: wsf-visual-review-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Export the canary PNG with a pinned manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head commit exactly (not the merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Package original bytes + manifest (inline, stdlib only; nothing from the tree is executed)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          repo = os.environ['REPO']
          want = os.environ['SOURCE_SHA']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != want:
              sys.exit(f'checked-out HEAD {head} is not the PR head {want}')
          # THE CANARY: one existing, committed PNG. Extend this list only after
          # the round trip has been downloaded and opened by the reviewer.
          allow = [
              ('docs/design-target/north-star-final/board-01/WE_STAY_FIT_NORTH_STAR_BOARD_01_HOME_FINAL.png',
               'CANONICAL BOARD 01 · current-build composite: real captures + labelled target/seam (2x) · status per north-star-final/README.md'),
          ]
          out = 'wsf-visual-review-canary'
          rows = []
          for rel, label in allow:
              if not os.path.isfile(rel):
                  sys.exit(f'missing: {rel}')
              data = open(rel, 'rb').read()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  sys.exit(f'not a PNG: {rel}')
              w, h = struct.unpack('>II', data[16:24])
              blob = subprocess.check_output(['git', 'rev-parse', f'HEAD:{rel}'], text=True).strip()
              dest = os.path.join(out, rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copyfile(rel, dest)
              rows.append({'path': rel, 'label': label, 'git_blob_sha1': blob, 'bytes': len(data),
                           'sha256': hashlib.sha256(data).hexdigest(), 'width': w, 'height': h})
          manifest = {'repo': repo, 'source_sha': head,
                      'note': 'original bytes copied from this commit; nothing rendered, resized or repaired',
                      'files': rows}
          json.dump(manifest, open(os.path.join(out, 'MANIFEST.json'), 'w'), indent=2)
          with open(os.path.join(out, 'MANIFEST.md'), 'w') as f:
              f.write(f'# WSF visual-review canary\n\nRepository `{repo}` · source commit `{head}` · original bytes.\n\n')
              f.write('| path | label | git blob | bytes | sha256 | w×h |\n| --- | --- | --- | ---: | --- | --- |\n')
              for r in rows:
                  f.write(f"| `{r['path']}` | {r['label']} | `{r['git_blob_sha1']}` | {r['bytes']} | `{r['sha256']}` | {r['width']}×{r['height']} |\n")
          print(open(os.path.join(out, 'MANIFEST.md')).read())
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-visual-review-canary-${{ github.event.pull_request.head.sha }}
          path: wsf-visual-review-canary
          if-no-files-found: error
          retention-days: 7
          # The PNG is already compressed; keep its bytes verbatim inside the zip.
          compression-level: 0
