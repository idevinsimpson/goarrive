# We Stay Fit — the browser/player journey, against staging AS IT ALREADY IS.
#
# WHY A SEPARATE WORKFLOW AND NOT A ROW IN THE DEPLOY WORKFLOW.
# This proof deploys nothing. It opens browsers against the staging build that
# is already serving, so it must not carry a deploy job, must not rebuild the
# candidate, and must not re-run the 24-row authorization suite. Adding it to
# wsf-staging-deploy.yml would have coupled a read-only browser proof to a
# privileged deployment every time somebody wanted to run it.
#
# WHAT IT STILL NEEDS FROM THE PRIVILEGED SIDE, and why:
#   - the approved candidate SHA, so the proof refuses to run against a build
#     nobody approved (the gate job, which holds no credential);
#   - the staging Web App SDK config, because the fixture identities are minted
#     through Identity Toolkit with the project's Web API key;
#   - a Google credential, to seed and to read back the documents the product
#     writes, and to remove every one of them afterwards.
#
# The cleanup manifest is this workflow's OWN file. It must never be the
# deploy workflow's manifest: two runs sharing one manifest would let one
# run's cleanup adopt or destroy the other's record of what it created.
name: WSF player journey

on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: "Optional confirmation. Must equal the approved candidate in .github/wsf-staging/approved-candidate.json. Leave blank to use the approved commit."
        required: false
        type: string

permissions: {}

concurrency:
  # Shares the deploy workflow's group on purpose: this proof enrols stations
  # and joins lines on live staging, so it must never run while a deployment
  # is replacing the build underneath it.
  group: wsf-staging-deploy
  cancel-in-progress: false

env:
  STAGING_PROJECT: westayfit-staging
  STAGING_SITE: westayfit-staging
  STAGING_URL: https://westayfit-staging--staging-4a616y5m.web.app
  FIREBASE_TOOLS: firebase-tools@15.30.1
  WIF_PROVIDER: projects/857281977774/locations/global/workloadIdentityPools/wsf-staging-github/providers/github
  DEPLOY_SA: wsf-staging-deployer@westayfit-staging.iam.gserviceaccount.com

jobs:
  # No credentials and no candidate code.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app_sha: ${{ steps.candidate.outputs.app_sha }}
    steps:
      - name: Check out operational assets at the running workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve the approved candidate
        id: candidate
        env:
          WSF_REQUESTED_SHA: ${{ inputs.app_sha }}
        run: node .github/wsf-staging/resolve-candidate.mjs .github/wsf-staging/approved-candidate.json

  config:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wsf-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pinned deployment tooling
        run: npm install --no-save --ignore-scripts "$FIREBASE_TOOLS"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Read the staging Web App SDK config
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase apps:sdkconfig WEB \
            --project "$STAGING_PROJECT" --json > sdkconfig.json
          node .github/wsf-staging/prepare-staging.mjs sdkconfig.json wsf-staging.env "$STAGING_PROJECT"
          rm -f sdkconfig.json

      - name: Upload the staging build configuration
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-player-env
          path: wsf-staging.env
          retention-days: 1
          if-no-files-found: error

  player-journey:
    needs: [gate, config]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: wsf-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out operational assets at the running workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false

      # The candidate is checked out for its pinned Playwright ONLY. Nothing
      # here builds or deploys it; the build under test is the one already
      # serving on the staging channel.
      - name: Check out the deployed candidate (for its Playwright dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.app_sha }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install candidate dependencies without lifecycle scripts
        working-directory: app
        run: npm --prefix apps/westayfit ci --ignore-scripts

      - name: Install pinned deployment tooling
        run: npm install --no-save --ignore-scripts "$FIREBASE_TOOLS"

      # Same reasoning as the deploy workflow: this job holds id-token: write,
      # so the Playwright CLI must be the candidate's own, never a registry
      # download `npx --yes` would fetch.
      - name: Install browsers using the candidate's pinned Playwright CLI
        working-directory: app
        run: |
          set -euo pipefail
          PW="apps/westayfit/node_modules/.bin/playwright"
          [ -x "$PW" ] || { echo "::error::the candidate's Playwright CLI is not present at $PW"; exit 1; }
          resolved="$(node -e '
            const {createRequire} = require("node:module");
            const req = createRequire(require("path").resolve("apps/westayfit/package.json"));
            console.log(req.resolve("@playwright/test/package.json"));
          ')"
          case "$resolved" in
            "$PWD/apps/westayfit/node_modules/"*) : ;;
            *) echo "::error::@playwright/test resolved outside the candidate installation: $resolved"; exit 1 ;;
          esac
          echo "PLAYWRIGHT_CLI=$PW"
          echo "PLAYWRIGHT_PACKAGE=$resolved"
          echo "PLAYWRIGHT_VERSION=$("$PW" --version)"
          # Chromium only. WebKit is not Safari and this proof never says it is.
          "$PW" install --with-deps chromium

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: wsf-player-env
          path: cfg

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Run the browser/player journey
        id: journey
        working-directory: app
        env:
          WSF_APPROVED_SHA: ${{ needs.gate.outputs.app_sha }}
          WSF_STAGING_URL: https://westayfit-staging--staging-4a616y5m.web.app
          WSF_RESULT_DIR: ${{ github.workspace }}/wsf-player-evidence
          WSF_CLEANUP_MANIFEST: ${{ github.workspace }}/wsf-player-evidence/cleanup-manifest.json
        run: |
          set -euo pipefail
          set -a; . ../cfg/wsf-staging.env; set +a
          export WSF_SDK_CONFIG_FILE="$RUNNER_TEMP/wsf-sdk/wsf-sdk-config.json"
          node ../ops/.github/wsf-staging/write-sdk-config.mjs "$WSF_SDK_CONFIG_FILE" "$STAGING_PROJECT"
          export WSF_GOOGLE_ACCESS_TOKEN="$(node -e '
            const {GoogleAuth} = require("google-auth-library");
            new GoogleAuth({scopes:["https://www.googleapis.com/auth/cloud-platform"]})
              .getAccessToken().then((t)=>process.stdout.write(t||""));
          ')"
          node ../ops/.github/wsf-staging/hosted-player-journey.mjs

      # Cleanup runs whatever the journey did, and re-authenticates first
      # because a browser journey can outlive the token that started it.
      - name: Re-authenticate before cleanup
        if: always()
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Remove synthetic fixtures
        if: always()
        env:
          WSF_CLEANUP_MANIFEST: ${{ github.workspace }}/wsf-player-evidence/cleanup-manifest.json
          WSF_CLEANUP_RECEIPT: ${{ github.workspace }}/wsf-player-evidence/cleanup-receipt.json
        run: |
          set -euo pipefail
          export WSF_GOOGLE_ACCESS_TOKEN="$(node -e '
            const {GoogleAuth} = require("google-auth-library");
            new GoogleAuth({scopes:["https://www.googleapis.com/auth/cloud-platform"]})
              .getAccessToken().then((t)=>process.stdout.write(t||""));
          ')"
          node ops/.github/wsf-staging/cleanup-synthetic.mjs

      # Redacting scan BEFORE the upload. Rejected evidence is never uploaded.
      - name: Scan evidence before upload
        id: scan-player-evidence
        if: always()
        run: node ops/.github/wsf-staging/scan-evidence.mjs "${{ github.workspace }}/wsf-player-evidence"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ always() && steps.scan-player-evidence.outcome == 'success' }}
        with:
          name: wsf-player-evidence
          path: wsf-player-evidence
          retention-days: 7
          if-no-files-found: error

      # An incomplete or failed journey must not leave a green run, and neither
      # must evidence the scanner rejected.
      - name: Require the journey and the scan to have passed
        if: always()
        run: |
          set -euo pipefail
          [ "${{ steps.journey.outcome }}" = "success" ] \
            || { echo "::error::the browser/player journey did not pass"; exit 1; }
          [ "${{ steps.scan-player-evidence.outcome }}" = "success" ] \
            || { echo "::error::the evidence scan rejected this run's evidence"; exit 1; }
