# WSF — visual-review export for the /join/[joinCode] page gate: the existing
# Batch B evidence named in W4's join-review-evidence.md, packaged at a pinned
# current app ref with each ORIGINAL capture revision retained in the label —
# the reviewer's proven native-file path (PR #365 comment 5785039295 §5).
# Scope, exactly: batch-b-join-and-setup/before (frozen, 30), after (30) for
# the ten Join states at 390x844 / 390x640 / 430x932, and TARGET-join-* (36)
# only — none of the setup/start-community/goal targets. Same posture as the
# other exporters: ordinary pull_request job into this one branch,
# contents:read, pinned actions, persist-credentials false, inline stdlib
# packaging, nothing from the tree executed, nothing recaptured, rendered or
# resized. This branch carries only this file on top of the app ref and is
# never merged; it exists to run the job.
name: WSF visual-review export — /join page gate (Batch B before/after/target)

on:
  pull_request:
    branches:
      - claude/wsf-app-shell
    paths:
      - '.github/workflows/wsf-visual-review-join-frames.yml'
      - 'docs/design-target/review/batch-b-join-and-setup/**'

permissions:
  contents: read

concurrency:
  group: wsf-visual-review-join-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Export the pinned canonical images with a manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head commit exactly (not the merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Package original bytes + manifest (inline, stdlib only; nothing from the tree is executed)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          repo = os.environ['REPO']
          want = os.environ['SOURCE_SHA']
          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if head != want:
              sys.exit(f'checked-out HEAD {head} is not the PR head {want}')
          NS = 'docs/design-target/north-star-final'
          OWNER = 'docs/design-target/owner-north-star'
          # THE EXACT ALLOWLIST: the 96 existing Batch B Join files, original committed
          # bytes only. Each label carries the kind, the state, the matched viewport and
          # the ORIGINAL capture/drawing revision (git log -1 for the path at the app ref).
          JB = 'docs/design-target/review/batch-b-join-and-setup'
          allow = [
              (f'{JB}/before/BEFORE-device-choice-390x640.png', 'BEFORE (frozen) · BEFORE-device-choice · viewport 390x640 · captured/drawn at c34526d 2026-09-22'),
