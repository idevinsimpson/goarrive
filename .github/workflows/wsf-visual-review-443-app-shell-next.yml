# WSF — visual-review export for PR #443's app-shell / navigation checkpoint 1:
# the 36 PNGs W9 adds under docs/design-target/review/app-shell-next/ (ten
# CURRENT-BUILD BEFORE captures of the real member routes at start SHA c8f38e3,
# twelve PROPOSED / NOT ACCEPTED captures of the gated shell prototype plus
# their contact sheet, and — at the PARTIAL successor cd5089b — twelve
# MIGRATED BUILD / NOT ACCEPTED captures of the migrated shell on the real
# routes: Home, Community, Progress, You, MOVE open and contributing at
# 390x844 and 390x640, plus their contact sheet), exported at their source commit as a
# workflow artifact with a manifest that pins each file to that commit — the
# reviewer's proven native-file path (owner direction PR #365 comment
# 5784428860 §3; the owner's shell decision 5788168334). Same exporter as
# #403 through #442, same posture: ordinary pull_request job into this one
# branch, contents:read, pinned actions, persist-credentials false, inline
# stdlib packaging, nothing from the tree executed, nothing rendered or
# resized. This branch carries only this file on top of W9's head and is
# never merged; it exists to run the job.
name: 'WSF visual-review export — #443 app shell migration checkpoint'

on:
  pull_request:
    branches:
      - claude/wsf-app-shell-nav
    paths:
      - '.github/workflows/wsf-visual-review-443-app-shell-next.yml'
      - 'docs/design-target/review/app-shell-next/**'

permissions:
  contents: read

concurrency:
  group: wsf-visual-review-443-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Export the pinned canonical images with a manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head commit exactly (not the merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Package original bytes + manifest (inline, stdlib only; nothing from the tree is executed)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          repo = os.environ['REPO']
          want = os.environ['SOURCE_SHA']
          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if head != want:
              sys.exit(f'checked-out HEAD {head} is not the PR head {want}')
          SN = 'docs/design-target/review/app-shell-next'
          # THE EXACT ALLOWLIST: the 36 PNGs PR #443 adds under app-shell-next/ — W9's CURRENT-BUILD
          # BEFOREs (real routes at c8f38e3), PROPOSED / NOT ACCEPTED prototype captures, and the
          # MIGRATED BUILD / NOT ACCEPTED PARTIAL successor captures at cd5089b — none an AFTER — at the PR
          # head this job checks out, original committed bytes only.
          allow = [
              (f'{SN}/before/CURRENT-BUILD-activity-390x640.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-activity-390x640.png'),
              (f'{SN}/before/CURRENT-BUILD-activity-390x844.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-activity-390x844.png'),
              (f'{SN}/before/CURRENT-BUILD-community-390x640.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-community-390x640.png'),
              (f'{SN}/before/CURRENT-BUILD-community-390x844.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-community-390x844.png'),
              (f'{SN}/before/CURRENT-BUILD-home-390x640.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-home-390x640.png'),
              (f'{SN}/before/CURRENT-BUILD-home-390x844.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-home-390x844.png'),
              (f'{SN}/before/CURRENT-BUILD-move-390x640.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-move-390x640.png'),
              (f'{SN}/before/CURRENT-BUILD-move-390x844.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-move-390x844.png'),
              (f'{SN}/before/CURRENT-BUILD-you-390x640.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-you-390x640.png'),
              (f'{SN}/before/CURRENT-BUILD-you-390x844.png', 'BEFORE · actual current build, captured from the real member routes at start SHA c8f38e3 · CURRENT-BUILD-you-390x844.png'),
              (f'{SN}/target/PROPOSED-a-home-390x640.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-a-home-390x640.png'),
              (f'{SN}/target/PROPOSED-a-home-390x844.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-a-home-390x844.png'),
              (f'{SN}/target/PROPOSED-b-community-390x640.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-b-community-390x640.png'),
              (f'{SN}/target/PROPOSED-b-community-390x844.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-b-community-390x844.png'),
              (f'{SN}/target/PROPOSED-c-progress-390x640.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-c-progress-390x640.png'),
              (f'{SN}/target/PROPOSED-c-progress-390x844.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-c-progress-390x844.png'),
              (f'{SN}/target/PROPOSED-contact-sheet.png', 'CONTACT SHEET · PROPOSED / NOT ACCEPTED prototype captures side by side · PROPOSED-contact-sheet.png'),
              (f'{SN}/target/PROPOSED-d-you-390x640.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-d-you-390x640.png'),
              (f'{SN}/target/PROPOSED-d-you-390x844.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-d-you-390x844.png'),
              (f'{SN}/target/PROPOSED-e-move-open-390x640.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-e-move-open-390x640.png'),
              (f'{SN}/target/PROPOSED-e-move-open-390x844.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-e-move-open-390x844.png'),
              (f'{SN}/target/PROPOSED-f-move-closed-390x640.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-f-move-closed-390x640.png'),
              (f'{SN}/target/PROPOSED-f-move-closed-390x844.png', 'PROPOSED · NOT ACCEPTED · gated shell prototype capture (persistent top bar, real tabs, MOVE as a focus flow) · PROPOSED-f-move-closed-390x844.png'),
              (f'{SN}/successor/MIGRATED-a-home-390x640.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-a-home-390x640.png'),
              (f'{SN}/successor/MIGRATED-a-home-390x844.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-a-home-390x844.png'),
              (f'{SN}/successor/MIGRATED-b-community-390x640.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-b-community-390x640.png'),
              (f'{SN}/successor/MIGRATED-b-community-390x844.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-b-community-390x844.png'),
              (f'{SN}/successor/MIGRATED-c-progress-390x640.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-c-progress-390x640.png'),
              (f'{SN}/successor/MIGRATED-c-progress-390x844.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-c-progress-390x844.png'),
              (f'{SN}/successor/MIGRATED-d-you-390x640.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-d-you-390x640.png'),
              (f'{SN}/successor/MIGRATED-d-you-390x844.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-d-you-390x844.png'),
              (f'{SN}/successor/MIGRATED-e-move-open-390x640.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-e-move-open-390x640.png'),
              (f'{SN}/successor/MIGRATED-e-move-open-390x844.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-e-move-open-390x844.png'),
              (f'{SN}/successor/MIGRATED-f-contribute-390x640.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-f-contribute-390x640.png'),
              (f'{SN}/successor/MIGRATED-f-contribute-390x844.png', 'MIGRATED BUILD · NOT ACCEPTED · PARTIAL successor cd5089b — capture of the migrated shell on the real member routes (not an AFTER; MOVE sheet and Members height still owed) · MIGRATED-f-contribute-390x844.png'),
              (f'{SN}/successor/MIGRATED-contact-sheet.png', 'CONTACT SHEET · MIGRATED BUILD / NOT ACCEPTED · PARTIAL successor cd5089b captures side by side · MIGRATED-contact-sheet.png'),
          ]
          PER_FILE_MAX = 8 * 1024 * 1024
          TOTAL_MAX = 24 * 1024 * 1024
          out = 'wsf-visual-review-443-app-shell-next'
          rows, total = [], 0
          for rel, label in allow:
              # Tracked as an ordinary regular file at this commit: mode 100644,
              # never a symlink (120000), submodule (160000) or executable.
              stage = git('ls-files', '--stage', '--', rel)
              if not stage:
                  sys.exit(f'not tracked at HEAD: {rel}')
              mode, blob = stage.split()[0], stage.split()[1]
              if mode != '100644':
                  sys.exit(f'refusing {rel}: tracked mode {mode}, not a regular file')
              if os.path.islink(rel) or not os.path.isfile(rel):
                  sys.exit(f'refusing {rel}: not a regular file in the checkout')
              if blob != git('rev-parse', f'HEAD:{rel}'):
                  sys.exit(f'index/HEAD disagree on {rel}')
              data = open(rel, 'rb').read()
              if len(data) > PER_FILE_MAX:
                  sys.exit(f'refusing {rel}: {len(data)} bytes exceeds the per-file bound')
              total += len(data)
              if total > TOTAL_MAX:
                  sys.exit(f'refusing: total exceeds the {TOTAL_MAX}-byte bound at {rel}')
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  sys.exit(f'not a PNG: {rel}')
              w, h = struct.unpack('>II', data[16:24])
              dest = os.path.join(out, rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copyfile(rel, dest)
              # The exported bytes must BE the committed blob: rehash the copy
              # with git's own object hashing and compare, not merely record it.
              copied = open(dest, 'rb').read()
              rehashed = git('hash-object', '--', dest)
              if rehashed != blob or hashlib.sha256(copied).digest() != hashlib.sha256(data).digest():
                  sys.exit(f'exported bytes for {rel} do not match the committed blob ({rehashed} vs {blob})')
              rows.append({'path': rel, 'label': label, 'git_blob_sha1': blob, 'bytes': len(data),
                           'sha256': hashlib.sha256(data).hexdigest(), 'width': w, 'height': h})
          manifest = {'repo': repo, 'source_sha': head, 'files_total_bytes': total,
                      'note': 'original bytes copied from this commit and re-hashed against the git blob; nothing rendered, resized or repaired',
                      'files': rows}
          json.dump(manifest, open(os.path.join(out, 'MANIFEST.json'), 'w'), indent=2)
          with open(os.path.join(out, 'MANIFEST.md'), 'w') as f:
              f.write(f'# PR #443 app shell migration checkpoint — visual review package\n\nRepository `{repo}` · source commit `{head}` · {len(rows)} files, {total} bytes · original bytes, re-hashed against git.\n\n')
              f.write('| path | label | git blob | bytes | sha256 | w×h |\n| --- | --- | --- | ---: | --- | --- |\n')
              for r in rows:
                  f.write(f"| `{r['path']}` | {r['label']} | `{r['git_blob_sha1']}` | {r['bytes']} | `{r['sha256']}` | {r['width']}×{r['height']} |\n")
          print(open(os.path.join(out, 'MANIFEST.md')).read())
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-visual-review-443-app-shell-next-${{ github.event.pull_request.head.sha }}
          path: wsf-visual-review-443-app-shell-next
          if-no-files-found: error
          retention-days: 7
          # The PNG is already compressed; keep its bytes verbatim inside the zip.
          compression-level: 0
