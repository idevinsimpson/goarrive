# We Stay Fit — control-state reconcile: one Step-5 SHADOW run of the wsf-control-writer App
# (AUTONOMY-STATE-1B; memo §4.1). It appends derived Step-5 facts to the protected state ref and edits only
# the App's own shadow comment. It never routes, wakes, dispatches, deploys or touches production.
#
# BOUNDARY
#   - The job always checks out and executes `main`, never the triggering PR's code, and it declares the
#     main-only environment `wsf-control-writer`, which holds the App key.
#   - The writer job's workflow token is read-only (`contents: read`). Every ledger write goes through the App
#     installation token, which shadow-run.mjs mints in process, down-scoped and masked. The App has no Actions write.
#   - The one exception is the separate `fastpath-dispatch` job below (Step 7, Director ruling #365 5940481437): its
#     own workflow token may dispatch workflows, it holds no App key, and it acts only behind the owner's recorded
#     set-fastpath switch.
#   - One writer at a time: a fixed concurrency group that queues rather than cancels, so a run already
#     pushing is never killed mid-write.
#   - `pull_request`, never `pull_request_target`.
#   - Comments the App itself posts are skipped (no self-trigger loop), as is any issue outside the six
#     control inboxes.
name: WSF control reconcile

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [synchronize, closed]
  workflow_run:
    workflows: ['WSF staging deploy']
    types: [completed]
  workflow_dispatch:
  # The fallback runs every 30 minutes off the hour and half-hour: GitHub delays, and under load drops, scheduled runs
  # at the start of the hour (its documented guidance is to schedule at another minute). Events stay the primary trigger.
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: wsf-control-writer
  cancel-in-progress: false

jobs:
  reconcile:
    # Only a main ref may reach the main-only environment. PR events still start the workflow, but on their
    # refs/pull/* ref the writer job is skipped (neutral) rather than refused red at the environment; the next
    # main-ref event or the schedule re-derives PR state (event payloads are only hints, memo §4.1).
    # A comment starts the job only when the repository owner wrote it (Check 71 F1): on a public repository
    # no other account's comment reaches the environment. The writer re-checks the same boundary per decision.
    # An edit keeps the comment's author, so an `edited` event starts the job only when the owner is the editor
    # (F1-R2a). The writer still refuses every decision from an edited comment; this only keeps a non-owner edit
    # from launching the protected job.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'issue_comment' || (
          github.event.comment.user.login != 'wsf-control-writer[bot]' &&
          github.event.comment.user.login == 'idevinsimpson' &&
          github.event.comment.author_association == 'OWNER' &&
          (github.event.action != 'edited' || github.event.sender.login == 'idevinsimpson') &&
          contains(fromJSON('[365, 394, 395, 396, 434, 497, 578]'), github.event.issue.number)
        )
      )
    runs-on: ubuntu-latest
    environment: wsf-control-writer
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Control-state regression suite
        run: node tools/wsf-control/run-all.mjs

      - name: Shadow run (live)
        env:
          WSF_CONTROL_WRITER_PRIVATE_KEY: ${{ secrets.WSF_CONTROL_WRITER_PRIVATE_KEY }}
          WSF_CONTROL_WRITER_APP_ID: '5098407'
        run: node tools/wsf-control/shadow-run.mjs --live

  # The Step-7 unattended fast-path dispatch (STAGING-FRESHNESS-DISPATCH; Director ruling #365 5940481437, Option B).
  # A separate, minimal job: it runs only after the writer job succeeded on main, holds NO App key and NO environment,
  # and its workflow token can read contents and dispatch workflows, nothing more. fastpath-dispatch.mjs re-reads the
  # protected state ref and dispatches the EXISTING wsf-staging-deploy.yml in target_source=ledger mode only when the
  # owner's recorded switch (set-fastpath) is on, the target is not served, never sent before, and still verifies. The
  # staging workflow's own gate re-verifies it again before anything is fetched or deployed. Revoke: record
  # set-fastpath {enabled: false} (the reviewed pin path is then the only path), or delete this job.
  fastpath-dispatch:
    needs: reconcile
    if: ${{ github.ref == 'refs/heads/main' && needs.reconcile.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # The ledger as the writer job just left it: DATA only, checked by the operational checker in the next step.
      - name: Check out the control ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: wsf-control-state-2
          path: control-ledger
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Dispatch the ledger fast path (or report why not)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export WSF_LEDGER_AUTHOR="$(git -C control-ledger log -1 --format=%an)"
          node .github/wsf-staging/fastpath-dispatch.mjs .github/wsf-staging/approved-candidate.json control-ledger
