# WSF — visual-review export for PR #451's W8 Packet B (Progress copy) checkpoint:
# the 5 PROPOSED / NOT ACCEPTED PNGs W8 adds under
# docs/design-target/review/community-presence/progress/ at their source commit
# (90f8e74e0b3cd84c115f81ee2b4ee979120e3670 — Director SOURCE PASS 5800473861,
# visual acceptance pending), plus the accepted Progress references the reviewer
# compares against (Page 04 TARGET and AFTER at 390x844 / 390x640, byte-identical
# frozen evidence) and the owner's after-target board — exported as a workflow
# artifact with a manifest that pins each file to that commit (owner direction
# PR #365 comment 5784428860 §3). Same exporter as #403 … #444 (#441's is the
# template), same posture: ordinary pull_request job into this one branch,
# contents:read, pinned actions, persist-credentials false, inline stdlib
# packaging, nothing from the tree executed, nothing rendered or resized. This
# branch carries only this file on top of W8's head and is never merged; it
# exists to run the job.
name: 'WSF visual-review export — #451 Progress copy (W8 Packet B)'

on:
  pull_request:
    branches:
      - claude/wsf-social-community
    paths:
      - '.github/workflows/wsf-visual-review-451-progress-copy.yml'
      - 'docs/design-target/review/community-presence/progress/**'

permissions:
  contents: read

concurrency:
  group: wsf-visual-review-451-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Export the pinned canonical images with a manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the PR head commit exactly (not the merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Package original bytes + manifest (inline, stdlib only; nothing from the tree is executed)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, sys
          repo = os.environ['REPO']
          want = os.environ['SOURCE_SHA']
          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()
          head = git('rev-parse', 'HEAD')
          if head != want:
              sys.exit(f'checked-out HEAD {head} is not the PR head {want}')
          CP = 'docs/design-target/review/community-presence/progress'
          P4 = 'docs/design-target/review/page-04-progress'
          OB = 'docs/design-target/owner-north-star'
          # THE EXACT ALLOWLIST: the 5 PNGs PR #451 adds under community-presence/progress/ —
          # W8's real-build captures on a synthetic fixture, every one carrying a
          # PROPOSED / NOT ACCEPTED strip above the screenshot, none an AFTER — at the PR head
          # this job checks out, original committed bytes only. Plus the accepted Page 04
          # Progress references (TARGET and AFTER, frozen, byte-identical since acceptance)
          # and the owner's after-target board, for side-by-side review only.
          allow = [
              (f'{CP}/PROPOSED-progress-populated-390x844.png', 'PROPOSED · NOT ACCEPTED · real build, synthetic fixture · Progress, populated · PROPOSED-progress-populated-390x844.png'),
              (f'{CP}/PROPOSED-progress-populated-390x640.png', 'PROPOSED · NOT ACCEPTED · real build, synthetic fixture · Progress, populated, short phone · PROPOSED-progress-populated-390x640.png'),
              (f'{CP}/PROPOSED-progress-empty-390x844.png', 'PROPOSED · NOT ACCEPTED · real build, synthetic fixture · Progress, empty · PROPOSED-progress-empty-390x844.png'),
              (f'{CP}/PROPOSED-progress-empty-390x640.png', 'PROPOSED · NOT ACCEPTED · real build, synthetic fixture · Progress, empty, short phone · PROPOSED-progress-empty-390x640.png'),
              (f'{CP}/PROPOSED-progress-error-390x844.png', 'PROPOSED · NOT ACCEPTED · real build, synthetic fixture · Progress, error · PROPOSED-progress-error-390x844.png'),
              (f'{P4}/TARGET-rows-390x844.png', 'ACCEPTED TARGET reference (Page 04, aebd1aa) · Progress with rows · TARGET-rows-390x844.png'),
              (f'{P4}/TARGET-rows-390x640.png', 'ACCEPTED TARGET reference (Page 04) · Progress with rows, short phone · TARGET-rows-390x640.png'),
              (f'{P4}/TARGET-none-390x844.png', 'ACCEPTED TARGET reference (Page 04) · Progress, none · TARGET-none-390x844.png'),
              (f'{P4}/TARGET-none-390x640.png', 'ACCEPTED TARGET reference (Page 04) · Progress, none, short phone · TARGET-none-390x640.png'),
              (f'{P4}/TARGET-failed-390x844.png', 'ACCEPTED TARGET reference (Page 04) · Progress, failed · TARGET-failed-390x844.png'),
              (f'{P4}/after/AFTER-rows-390x844.png', 'ACCEPTED AFTER (Page 04, historical copy — pre-shell, old wording) · AFTER-rows-390x844.png'),
              (f'{P4}/after/AFTER-rows-390x640.png', 'ACCEPTED AFTER (Page 04, historical copy — pre-shell, old wording) · AFTER-rows-390x640.png'),
              (f'{P4}/after/AFTER-empty-390x844.png', 'ACCEPTED AFTER (Page 04, historical copy — pre-shell, old wording) · AFTER-empty-390x844.png'),
              (f'{P4}/after/AFTER-empty-390x640.png', 'ACCEPTED AFTER (Page 04, historical copy — pre-shell, old wording) · AFTER-empty-390x640.png'),
              (f'{P4}/after/AFTER-failure-390x844.png', 'ACCEPTED AFTER (Page 04, historical copy — pre-shell, old wording) · AFTER-failure-390x844.png'),
              (f'{OB}/OWNER-BOARD-2-after-target-wsf-vision.png', "OWNER REFERENCE · the owner's after-target board · OWNER-BOARD-2-after-target-wsf-vision.png"),
          ]
          PER_FILE_MAX = 8 * 1024 * 1024
          TOTAL_MAX = 24 * 1024 * 1024
          out = 'wsf-visual-review-451-progress-copy'
          rows, total = [], 0
          for rel, label in allow:
              # Tracked as an ordinary regular file at this commit: mode 100644,
              # never a symlink (120000), submodule (160000) or executable.
              stage = git('ls-files', '--stage', '--', rel)
              if not stage:
                  sys.exit(f'not tracked at HEAD: {rel}')
              mode, blob = stage.split()[0], stage.split()[1]
              if mode != '100644':
                  sys.exit(f'refusing {rel}: tracked mode {mode}, not a regular file')
              if os.path.islink(rel) or not os.path.isfile(rel):
                  sys.exit(f'refusing {rel}: not a regular file in the checkout')
              if blob != git('rev-parse', f'HEAD:{rel}'):
                  sys.exit(f'index/HEAD disagree on {rel}')
              data = open(rel, 'rb').read()
              if len(data) > PER_FILE_MAX:
                  sys.exit(f'refusing {rel}: {len(data)} bytes exceeds the per-file bound')
              total += len(data)
              if total > TOTAL_MAX:
                  sys.exit(f'refusing: total exceeds the {TOTAL_MAX}-byte bound at {rel}')
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  sys.exit(f'not a PNG: {rel}')
              w, h = struct.unpack('>II', data[16:24])
              dest = os.path.join(out, rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copyfile(rel, dest)
              # The exported bytes must BE the committed blob: rehash the copy
              # with git's own object hashing and compare, not merely record it.
              copied = open(dest, 'rb').read()
              rehashed = git('hash-object', '--', dest)
              if rehashed != blob or hashlib.sha256(copied).digest() != hashlib.sha256(data).digest():
                  sys.exit(f'exported bytes for {rel} do not match the committed blob ({rehashed} vs {blob})')
              rows.append({'path': rel, 'label': label, 'git_blob_sha1': blob, 'bytes': len(data),
                           'sha256': hashlib.sha256(data).hexdigest(), 'width': w, 'height': h})
          manifest = {'repo': repo, 'source_sha': head, 'files_total_bytes': total,
                      'note': 'original bytes copied from this commit and re-hashed against the git blob; nothing rendered, resized or repaired',
                      'files': rows}
          json.dump(manifest, open(os.path.join(out, 'MANIFEST.json'), 'w'), indent=2)
          with open(os.path.join(out, 'MANIFEST.md'), 'w') as f:
              f.write(f'# PR #451 Progress copy (W8 Packet B) — visual review package\n\nRepository `{repo}` · source commit `{head}` · {len(rows)} files, {total} bytes · original bytes, re-hashed against git.\n\n')
              f.write('| path | label | git blob | bytes | sha256 | w×h |\n| --- | --- | --- | ---: | --- | --- |\n')
              for r in rows:
                  f.write(f"| `{r['path']}` | {r['label']} | `{r['git_blob_sha1']}` | {r['bytes']} | `{r['sha256']}` | {r['width']}×{r['height']} |\n")
          print(open(os.path.join(out, 'MANIFEST.md')).read())
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsf-visual-review-451-progress-copy-${{ github.event.pull_request.head.sha }}
          path: wsf-visual-review-451-progress-copy
          if-no-files-found: error
          retention-days: 7
          # The PNG is already compressed; keep its bytes verbatim inside the zip.
          compression-level: 0
